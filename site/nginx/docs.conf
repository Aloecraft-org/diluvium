# diluvium.aloecraft.org/docs/ — how the documentation site wants to be
# served. A drop-in for site-extra/diluvium.aloecraft.org/, beside
# diluvium.conf, which is the landing page's policy; this file carries no
# `root` and no `listen` for the same reason that one does not.
#
# /docs/ is a Docusaurus build. It is NOT produced by site/build.sh --
# that build is the site contract, offline and hermetic, and Docusaurus is
# an `npm ci`. It is built and shipped by deploy/cloud1/docs/deploy.sh in
# this repo. See deploy/README.md, which also carries the row lk2's
# manifest/sites.json needs before the first sync.

# Docusaurus content-hashes everything under assets/ -- `styles.b7a1c9fc.css`,
# `main.<hash>.js` -- so a changed file is a new filename and the old one
# can be cached for as long as a browser likes. Same guarantee the landing
# page gets from render.py's ?v= stamps, arrived at a different way.
location /docs/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The documents themselves are revalidated on every visit. no-cache means
# "revalidate", not "do not store": nginx emits an ETag, so the cost of an
# unchanged page is a 304 rather than a re-download.
#
# try_files is what makes a bare /docs/Guide work. Docusaurus emits
# directories with an index.html (build/Guide/index.html), and without the
# $uri/ term nginx answers 404 for the URL every link in the site points
# at. The /docs/404.html fallback is Docusaurus's own styled page, so a
# mistyped path lands somewhere with the sidebar on it.
location /docs/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ $uri.html /docs/404.html;
}

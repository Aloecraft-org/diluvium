# diluvium.aloecraft.org — how the landing page wants to be served.
#
# A drop-in, not a server block: the vhost is generated from the domain
# manifest in lk2 and includes site-extra/diluvium.aloecraft.org/*.conf,
# which is where this belongs. It carries no `root` and no `listen` on
# purpose. The Lab at /lab/ and the retiring mirror at /release/ have their
# own policies in lk2's ansible-web.yaml; nothing here reaches into a
# sibling's path. The mirrors live on software.aloecraft.org/releases/.
#
# This file REPLACES two things ansible-web.yaml used to write inline:
# start.conf (the /start content type, now a redirect) and the landing-page half of
# cache.conf (the webpack `main.<hash>.js` rule, which matches nothing now
# that there is no bundle). Installing it beside either duplicates a
# location and nginx refuses the whole config; the Lab's `location /lab/`
# in cache.conf stays.

# The installers live with their releases, not here. Each short URL, with
# or without .sh, redirects to the copy on its project's mirror under
# latest/, so a release changes what they serve with no deploy of this
# site; `curl -fsSL` follows the redirect. Bare /start, /install, /get
# and /help are DRT's. static/_redirects is the same list for Cloudflare Pages, and
# check.py holds the two together. 302, so nothing caches the redirect.
location ~ ^/(start|install|get|help)-dlua(\.sh)?$ {
    return 302 https://software.aloecraft.org/releases/diluvium/latest/$1-dlua.sh;
}
location ~ ^/(start|install|get|help)(-drt)?(\.sh)?$ {
    return 302 https://software.aloecraft.org/releases/diluvium-drt/latest/$1-drt.sh;
}

# The document is revalidated on every visit. no-cache means "revalidate",
# not "do not store": nginx emits an ETag, so the cost is a 304, not a
# re-download.
location = / {
    add_header Cache-Control "no-cache" always;
}
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Every reference to assets/ carries ?v=<content hash>, stamped by
# site/render.py at build time -- in index.html and in every import between
# the page's modules. A changed file is a new URL, so the old one can be
# cached for as long as a browser likes. The only unstamped reader is a
# person typing the bare URL, who gets a stale copy of something they
# were not sent to.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

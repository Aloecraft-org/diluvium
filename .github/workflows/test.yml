name: Tests

# Runs the Lua test suite plus a few Diluvium-specific smoke checks.
#
# Three ways in:
#   * automatically on every push and pull request
#   * manually, against any commit, branch or tag  (Actions -> Tests -> Run workflow)
#   * called by release.yml as a gate before publishing

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to test (blank = the branch selected above)'
        type: string
        required: false
        default: ''
      include_skipped:
        # The list here is checkable: ./test/run_tests.sh --list-skipped prints
        # it. It used to name api, attrib and literals as well, which were
        # recovered in c39649c and have run ever since -- so an operator reading
        # it was told three tests would start running that had never stopped.
        # The guard caveat matters for the same reason: a guard is a
        # precondition evaluated at run time, so it still skips under this
        # toggle, and a green run with it set is not evidence that a
        # platform-guarded test passed.
        description: 'Also run the normally-skipped tests (big, heavy, main). Guarded tests still skip when their precondition is absent.'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      include_skipped:
        description: 'Also run the normally-skipped tests (big, heavy, main). Guarded tests still skip when their precondition is absent.'
        type: boolean
        required: false
        default: false
    outputs:
      sha:
        description: 'The exact commit that was tested'
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Pin the exact commit once, so every job below tests the same tree even if
  # the branch moves mid-run. This is what makes a manual run commit-specific
  # rather than branch-specific.
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      short_sha: ${{ steps.info.outputs.short_sha }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: info
        run: |
          set -eu
          SHA=$(git rev-parse HEAD)
          {
            echo "sha=$SHA"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
            echo "version=$(tr -d '[:space:]' < VERSION)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Commit under test"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Version | \`$(tr -d '[:space:]' < VERSION)\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Subject | $(git log -1 --pretty=%s) |"
          } >> "$GITHUB_STEP_SUMMARY"

  suite:
    name: Suite (${{ matrix.name }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Both entries are experimental: false, so neither is advisory -- macOS was
    # promoted after it had been green for a while and the comment saying otherwise
    # outlived the change. Kept as a matrix field rather than deleted because the
    # next platform added will want it, and a job whose failure is ignored should
    # have to say so out loud.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            experimental: false
          - name: macos-arm64
            os: macos-latest
            experimental: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build debug binary (with ltests.h assertions)
        run: make test_build

      - name: Run suite
        run: |
          ./test/run_tests.sh \
            --bin dist/diluvium_debug \
            --timeout 300 \
            ${{ inputs.include_skipped && '--include-skipped' || '' }}

      # The call driver has no guest binding, so run_tests.sh cannot reach it.
      # Same debug flags as the suite: 'api_check' is where its stack
      # arithmetic fails loudly instead of corrupting silently.
      - name: Run the call-driver contract tests
        run: make dtask_check

      # The instance ABI, written against dv.h alone. Runs everywhere the suite
      # does, so the surface hosts depend on is covered even where cargo is not.
      - name: Run the instance-ABI contract tests
        run: make dv_check

      # The accessor shim is the only file that reads Lua's internal structs,
      # so an upstream rename breaks the build; these catch the quieter
      # failure, where the fields keep their names and change their meaning.
      # They also hold the invariant hibernation rests on -- no
      # continuation-less C frame below a yield.
      - name: Run the accessor-shim contract tests
        run: make dshim_check

      # The named-continuation registries under concurrent 'dv_new'. Fresh
      # processes rather than loop turns: the race window is the first few
      # microseconds of a cold process and shuts for good once every name is
      # registered, so iterations inside one process sample nothing. This lane
      # is a crash-regression guard and a weak one -- ThreadSanitizer, in the
      # sanitizers job below, is what actually decides.
      - name: Run the registry race check
        run: make dshim_race_check

      # SHA-256 against the published vectors. Checked against the standard and
      # not against itself, because 10.5 makes a Proto's hash a security
      # boundary: a collision is a snapshot naming one function and being handed
      # another. Builds without Lua, which is also part of the contract.
      - name: Run the SHA-256 conformance tests
        run: make dhash_check

      # The snapshot value graph and header.
      - name: Run the snapshot contract tests
        run: make dsnap_check

      # The swarm layer, compiled separately from the amalgamation on purpose:
      # dvs.c includes dv.h and nothing else from the tree, and the moment it
      # needs a lua_State something has been put in the wrong layer. The build
      # is the check for that; the tests are for attenuation, subtree kill and
      # the spawn rate limit.
      - name: Run the swarm-layer contract tests
        run: make dvs_check

      # The generic host end to end: the config's refusals, every connector,
      # the listener over a real socket, and build8's deferred-reply ledger
      # and plugin channel over a real child process on a real socketpair.
      # It builds its own plugin fixture, which links nothing from this tree.
      - name: Run the generic host's contract tests
        run: make host_check

      # Needs two builds of the tree, so it cannot live in dsnap_check.c: the
      # runtime fingerprint must separate builds whose version and LUAC_FORMAT
      # are identical, which is the measurement 10.6 was corrected from.
      - name: Check that the runtime fingerprint separates builds
        run: ./test/fingerprint_check.sh

      # 10.10's acceptance criterion: structure-aware mutation of a real
      # snapshot, asserting a refusal and never a crash. It found the two
      # validation gaps it now guards, and it found them because it loads in a
      # separate process -- which two instances in one process cannot do.
      - name: Fuzz the snapshot restore path
        run: make snap_fuzz

      # The token cursor on hostile input. It is the parser the swarm layer uses
      # for 'system/lifecycle', and guests write those, so it is a trust boundary
      # that nothing had tested on malformed bytes -- the only cross-check fed it
      # what the encoder produced. 400,000 inputs under ASan; it found an overflow
      # that only bites where size_t is 32 bits, which is wasm32.
      - name: Fuzz the msgpack token cursor
        run: make mp_cursor_fuzz

      # Prints what a resident instance costs; asserts nothing. 18.2's profile A
      # drops hibernation, so a deployment's density is bounded by the resident
      # figure and not by a snapshot's size -- and that figure had never been
      # measured. It is here so the number appears in every run's log and a drift
      # is visible in the diff between two runs, which is the whole use for it.
      - name: Measure what a resident instance costs
        run: make footprint

      # The swarm layer as an actual library, which nothing built until now: 4.1,
      # 11.5 and 12.1 all call it a separate library and 12.1 lists a
      # diluvium-swarm archive among the release artifacts, but dvs.c was only ever
      # compiled into a test binary. The step also checks the layer boundary at the
      # *linker* -- no 'lua' symbol may appear in dvs.o -- which is the claim being
      # made, and a stronger one than compiling without lua.h.
      - name: Build libdiluvium-swarm and check its symbol boundary
        run: make build_swarm_lib

      # A runtime file added to onelua.c but not to src/makefile's AUX_O (or
      # the reverse) links in one build and not the other. Catch it here, at
      # the source, before the platform build below fails at link with a
      # symbol name three layers removed from the missing entry.
      - name: Check the amalgamation and per-file source lists agree
        run: python3 script/check_source_lists.py

      # The release build catches what the amalgamation hides: a file that uses a
      # core macro without including its header compiles in onelua.c and fails
      # here. Two such bugs reached the tree before this was in the sweep.
      - name: Build the platform target, which links each file separately
        run: make build_platform

      # Needs a signal and a subprocess, so it cannot live in run_tests.sh.
      # The --task case is the one that regresses silently.
      - name: Check that Ctrl-C interrupts a runaway loop
        run: ./test/interrupt_check.sh --bin dist/diluvium_debug

  rust-binding:
    name: Rust binding
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # No toolchain action: the runner image ships a stable Rust, and pinning
      # one here would hide the version skew a published crate actually meets.
      - name: Versions
        run: cargo --version && rustc --version && cc --version | head -1

      # The -sys crate compiles the amalgamation from source, so this also
      # checks that src/ builds with -DMAKE_LIB outside the project Makefile.
      - name: Test the binding
        working-directory: bindings/rust
        run: cargo test --all

      # 'lua' is off by default -- dv.h is sealed and a lua_State is a
      # deliberate exception to that -- so '--all' does not reach it, and the
      # FFI a front end depends on would rot unwatched. Named here rather
      # than made default so the boundary stays something you ask for.
      - name: Test the Lua C API feature
        working-directory: bindings/rust
        run: cargo test -p diluvium-sys --features lua

      - name: The example host runs
        working-directory: bindings/rust
        run: cargo run --quiet --example echo

      # Windows, from here. Cross-compiling catches what matters -- that the
      # amalgamation compiles for the target, and that every symbol resolves
      # -- without a second runner, and 'cargo build --tests' is the part that
      # counts: a library crate is never linked, so 'cargo build' alone
      # reports success on an object built for the wrong platform. That was a
      # live bug until build.rs learned to check the object's format for
      # native targets and not only for wasm.
      #
      # GNU rather than MSVC: build.rs drives a GCC-style compiler and refuses
      # MSVC by name. If that changes, this is where it gets proved.
      - name: Windows toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - name: Cross-compile and link for Windows
        working-directory: bindings/rust
        run: cargo build --tests -p diluvium-sys --features lua --target x86_64-pc-windows-gnu

  wasmtime-binding:
    name: wasmtime binding
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build
        working-directory: bindings/rust
        run: cargo build -p diluvium-wasmtime --examples

      # These need no container, which is the point of them: the engine has to
      # accept the exception-handling instructions the wasi-sdk emits for Lua's
      # setjmp/longjmp, and for weeks nothing checked that anywhere a developer
      # would see it -- the only module the crate ever loaded came from the step
      # below. A hand-written module with a 'throw' in it is enough.
      - name: Run the engine-configuration tests
        working-directory: bindings/rust
        run: cargo test -p diluvium-wasmtime

      # Needs the wasi-sdk in a container, so this is the only place the crate is
      # exercised against a real module. See bindings/README.md.
      - name: Build the wasm runtime
        run: make build_wasm

      - name: The sandboxed example runs
        working-directory: bindings/rust
        run: cargo run -p diluvium-wasmtime --example sandboxed -- ../../dist/diluvium_wasi.wasm

  python-binding:
    name: Python binding
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install
        run: pip install cffi msgpack pytest

      # API mode: the extension compiles src/ here, so a mismatch between the
      # cdef and the real header fails the build rather than the first call.
      - name: Build the extension
        working-directory: bindings/python
        run: python3 build_ffi.py

      - name: Test
        working-directory: bindings/python
        run: PYTHONPATH=src python3 -m pytest tests -q

  js-binding:
    name: JavaScript binding
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Two things, neither needing a container. The codec is checked against
      # vectors produced by src/dmsgpack.c rather than against the spec, so this
      # asserts cross-implementation agreement on the wire format. And the WASI
      # host is checked against a hand-assembled module that imports
      # wasi_snapshot_preview1 -- because the wrapper instantiated with no imports
      # at all for weeks, and the only step that would have noticed was the one
      # below that needs the wasi-sdk.
      - name: Test the codec and the WASI host
        working-directory: bindings/js
        run: npm test

      # The wasm wrapper needs a real module, which needs the wasi-sdk. This is
      # the only place it gets exercised; see bindings/README.md.
      - name: Build the wasm runtime
        run: make build_wasm

      - name: Integration test against the real wasm
        working-directory: bindings/js
        run: node test/instance.integration.mjs ../../dist/diluvium_wasi.wasm

  site:
    name: Landing page
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # site/ is diluvium.aloecraft.org, built by the Aloecraft site contract:
      # ./site/build.sh --out DIR, offline, hermetic, idempotent, and it never
      # deploys. check.py runs inside the build, but first and on its own:
      # when the template loses a load-bearing detail, that is the message
      # worth reading, not a downstream render error.
      - name: Check the template's invariants
        run: python3 site/check.py

      # This job has no secrets and installs nothing, so a build that grew a
      # network fetch or a credential fails here rather than on the laptop
      # that happens to have one. It is the whole reason the webpack build
      # went away.
      - name: Build
        run: ./site/build.sh --out "$RUNNER_TEMP/out"

      - name: The build produced the page, the installer, and stamped its assets
        run: |
          set -eu
          test -s "$RUNNER_TEMP/out/index.html"
          test -s "$RUNNER_TEMP/out/start"
          grep -q 'src="assets/app.js?v=' "$RUNNER_TEMP/out/index.html"
          grep -q "from './repl/terminal.js?v=" "$RUNNER_TEMP/out/assets/app.js"

      # Idempotence is what lets lk_web's stage.py and deploy.py rsync
      # --checksum without shipping the whole tree on every run.
      - name: Build again and require identical bytes
        run: |
          ./site/build.sh --out "$RUNNER_TEMP/out2"
          diff -r "$RUNNER_TEMP/out" "$RUNNER_TEMP/out2"

  patch-guard:
    name: Core patch guard
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0   # the fork-point commit must be reachable

      - name: Only allowlisted core files may diverge from upstream
        run: ./script/patch_series.sh check

      - name: Patch series generates and re-applies cleanly
        run: |
          set -eu
          ./script/patch_series.sh generate /tmp/series.patch
          mkdir -p /tmp/roundtrip/src
          for f in $(git ls-tree --name-only 7579fc9d7ed90240487251dfb69168f8e64e9294 | grep -E '\.(c|h)$'); do
            git show "7579fc9d7ed90240487251dfb69168f8e64e9294:$f" > "/tmp/roundtrip/src/$f"
          done
          cd /tmp/roundtrip && patch -p1 --quiet < /tmp/series.patch
          fail=0
          for f in src/*.c src/*.h; do
            cmp -s "$f" "$GITHUB_WORKSPACE/$f" || { echo "MISMATCH after re-apply: $f"; fail=1; }
          done
          exit $fail

      - name: Upload the generated series
        uses: actions/upload-artifact@v4
        with:
          name: core-patch-series-${{ needs.resolve.outputs.short_sha }}
          path: /tmp/series.patch
          retention-days: 90

  sanitizers:
    name: ASan + UBSan
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Not the ltests.h debug build: that installs its own allocator, which
      # would fight AddressSanitizer for the same job. This is an ordinary
      # build with the sanitizers on.
      - name: Build with sanitizers
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g \
            -DLUA_USE_LINUX -Wl,-E -ldl -o dist/diluvium_asan .data/onelua.c -lm
          gcc -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g \
            -o dist/luac_asan .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -DMAKE_LUAC -lm

      - name: Suite under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test/run_tests.sh --bin dist/diluvium_asan --timeout 900

      # The contract tests, which the sweep had been missing entirely. The step
      # above builds onelua.c and runs the *Lua* suite, so it covers the runtime a
      # program reaches and not the C ABI a host reaches -- and dvs.c is not in the
      # amalgamation at all, so the newest code with the most raw malloc/free in the
      # tree had never met a sanitizer. This found undefined behaviour in the SHA-256
      # update on its first run: lua_dump signals end-of-dump by calling the writer
      # with (NULL, 0), and memcpy's parameters are non-null whatever the length.
      - name: Contract tests under the sanitizers
        run: make sanitize_checks

      # ThreadSanitizer, in its own build because it cannot be combined with
      # AddressSanitizer. This is the gate on the continuation registries, and
      # the reason it exists is that neither ASan nor UBSan -- nor valgrind's
      # default tool -- detects a data race at all, so four days of clean
      # sanitizer runs said nothing about a race that was killing CI. On the
      # unfixed tree this reports 'dshim_ncont' on the first execution.
      - name: The registry race check under ThreadSanitizer
        run: make dshim_race_tsan

      # The compiler and the analyzer walk instruction operands by hand, so
      # they are exactly where a decoding mistake hides. This is what caught
      # analyze.c reading OP_NEWTABLE with Lua 5.4's operand widths: the
      # guard against that is a debug-build assertion, so a release build
      # read the wrong bits without complaint.
      - name: Compiler and analyzer under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -eu
          for f in test/*.lua; do
            ./dist/luac_asan -r -o /dev/null "$f" >/dev/null
          done
          echo "analysed $(ls test/*.lua | wc -l) files with no sanitizer report"

  fuzz:
    name: Loader fuzz
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # The debug binary, not the release one: its allocator asserts on a
      # leak at exit and its GC checks are on, which is what makes the quiet
      # failures visible. Both loader bugs fixed in 5.5.1_build2 were found
      # this way rather than by the suite.
      - name: Build debug binary (with ltests.h assertions)
        run: make test_build

      # Fixed seeds, so a failure here is reproducible from the log rather
      # than being a thing that happened once. Rotate or add seeds to widen
      # coverage; do not randomise, or a red build cannot be re-run.
      - name: Mutate and load
        run: |
          set -eu
          for seed in 20260808 31337 65535 8675309; do
            ./dist/diluvium_debug script/fuzz_undump.lua 2000 "$seed"
          done

      # Loading a mutant is only half of it: corrupting an instruction
      # operand usually leaves a chunk that still loads, and the damage
      # appears when the VM runs it. fuzz_exec runs them.
      #
      # --allowed is a CEILING, not a target. It was 35 before the verifier
      # landed, then 3 for the residual SETLIST type assumption. That is now
      # closed by a runtime type-test in the VM (the one dataflow fact a
      # load-time verifier could not settle), so this is 0: a random-byte
      # mutation that loads and then crashes the release interpreter is a
      # regression, full stop. Never raise it to make a build green.
      - name: Build release binary
        run: make build_platform || make
      - name: Mutate, load and run
        run: |
          set -eu
          BIN=$(ls dist/diluvium_linux_x86_64 dist/diluvium 2>/dev/null | head -1)
          # A build that half-succeeds leaves no binary here; fail on that
          # rather than handing the fuzzer an empty --bin (a cryptic
          # PermissionError from subprocess) that reads as a fuzzer fault.
          test -n "$BIN" || { echo "no release binary in dist/ -- the build step did not produce one" >&2; exit 1; }
          ./script/fuzz_exec.py --bin "$BIN" --rounds 200 --seed 7 --allowed 0

      # The attack-rate companion to fuzz_exec's accident rate. It finds the
      # code array and sets each instruction operand out of range for the
      # prototype that owns it -- exactly what the verifier checks -- so a
      # crash here means the verifier let an out-of-range operand through.
      # --allowed 0, and it stays there: this is the gate that says the
      # operand crash class is closed. (Measured off vs on: 111 crashes
      # become 0 on this corpus.)
      - name: Corrupt operands, load and run
        run: |
          set -eu
          BIN=$(ls dist/diluvium_linux_x86_64 dist/diluvium 2>/dev/null | head -1)
          test -n "$BIN" || { echo "no release binary in dist/ -- the build step did not produce one" >&2; exit 1; }
          ./script/fuzz_struct.py --bin "$BIN" --allowed 0

  changelog:
    name: Changelog
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Changelog tooling
        run: pip install --quiet pyyaml

      # CHANGELOG.yaml is the source of truth for the release page and for
      # the release mirror, so a mistake here is a mistake on a published
      # artifact. 'check' catches the committed CHANGELOG.md and
      # changelog.json drifting from it -- the mirror reads that JSON with
      # a stdlib-only Python, which is why it is committed rather than
      # generated on demand.
      - name: Changelog is valid and its generated copies are current
        run: |
          set -eu
          ./script/changelog.py validate
          ./script/changelog.py check

      # The newest entry describes the tree it sits in. The version lives
      # in three files here, so this is where drift between them surfaces.
      - name: Tree agrees with the newest entry
        run: ./script/changelog.py consistency

  analyzer:
    name: Analysis report
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build luac
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -o dist/luac .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -std=c99 -DMAKE_LUAC -lm

      - name: Generate and validate the report
        run: |
          set -eu
          # `luac -r <file>` writes the JSON report to luac.out.
          ./dist/luac -r test/analyze.lua
          python3 - <<'PY'
          import json, sys
          with open("luac.out") as fh:
              report = json.load(fh)
          for key in ("lua_version", "functions"):
              if key not in report:
                  sys.exit(f"analysis report is missing top-level key {key!r}")
          fns = report["functions"]
          if not isinstance(fns, list) or not fns:
              sys.exit("analysis report contains no functions")
          print(f"report OK: {len(fns)} functions, lua_version={report['lua_version']}")
          PY

      - name: Compile every test file (parser smoke check)
        run: |
          set -eu
          fail=0
          for f in test/*.lua; do
            if ! ./dist/luac -p "$f" >/dev/null 2>&1; then
              echo "parse failed: $f"
              fail=1
            fi
          done
          exit $fail

  obfuscation-audit:
    name: Obfuscation audit (advisory)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build luac
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -o dist/luac .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -std=c99 -DMAKE_LUAC -lm

      - name: Check that a ~function leaks nothing in plaintext
        env:
          # Strict since the fixes for handoff findings 3 (scramble length was
          # an instruction count, not a byte count), 4 (is_encrypted now
          # propagates to nested closures) and the saved-string leak (a
          # literal shared with ordinary code had one stored copy, in the
          # clear): any plaintext marker in a secure dump is a regression.
          STRICT: 'true'
        run: |
          set -eu
          # MARKER_SHARED_* are the interesting ones: 5.5 stores each distinct
          # string once and back-references it, so a literal a secure function
          # shares with ordinary code has a single stored copy at whichever
          # site was dumped first -- which is not always the secure one.
          cat > /tmp/secure_probe.lua <<'LUA'
          local shared_before = "MARKER_SHARED_ENCLOSING";
          -- the ';' matters: '~' is also binary xor, so a '~function' line
          -- following an expression is otherwise absorbed into it.
          ~function probe()
            local direct = "MARKER_DIRECT_CONSTANT"
            local nested = function() return "MARKER_NESTED_CONSTANT" end
            return direct, nested, "MARKER_SHARED_ENCLOSING", "MARKER_SHARED_SIBLING"
          end
          local function sibling() return "MARKER_SHARED_SIBLING" end
          return probe, sibling, shared_before
          LUA
          # Dump unstripped too: debug names of a secure function are strings
          # like any other, and -s would hide a leak in them.
          ./dist/luac -s -o /tmp/secure_probe.out /tmp/secure_probe.lua
          ./dist/luac -o /tmp/secure_probe_debug.out /tmp/secure_probe.lua

          leaked=0
          for marker in MARKER_DIRECT_CONSTANT MARKER_NESTED_CONSTANT \
                        MARKER_SHARED_ENCLOSING MARKER_SHARED_SIBLING; do
            if grep -qa "$marker" /tmp/secure_probe.out ||
               grep -qa "$marker" /tmp/secure_probe_debug.out; then
              echo "LEAKED   $marker  (present in plaintext in the dumped chunk)"
              leaked=1
            else
              echo "obscured $marker"
            fi
          done

          {
            echo "### Obfuscation audit"
            echo ""
            if [ "$leaked" -eq 0 ]; then
              echo "No plaintext markers found in the dumped secure chunk."
            else
              echo "Plaintext markers found in the dumped secure chunk."
              echo "Expected while handoff findings 3 and 4 are open."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$leaked" -eq 0 ]; then
            echo "no plaintext leaked"
          elif [ "$STRICT" = true ]; then
            echo "::error::secure chunk contains plaintext constants"
            exit 1
          else
            echo "::warning::secure chunk contains plaintext constants (known: handoff findings 3 and 4)"
          fi

      - name: Check that no single-byte XOR pass recovers the markers
        run: |
          set -eu
          # The grep above passes for any scramble at all, including one
          # repeated byte -- which it was until the keystream landed, leaving
          # the strings one 'tr' pass from readable. Sweeping all 256 keys
          # tests the shape of the encoding rather than a constant, so this
          # cannot pass again by accident if someone simplifies the scramble.
          python3 - <<'PY'
          import sys
          markers = [b"MARKER_DIRECT_CONSTANT", b"MARKER_NESTED_CONSTANT",
                     b"MARKER_SHARED_ENCLOSING", b"MARKER_SHARED_SIBLING"]
          bad = 0
          for path in ("/tmp/secure_probe.out", "/tmp/secure_probe_debug.out"):
              blob = open(path, "rb").read()
              for key in range(256):
                  flipped = bytes(b ^ key for b in blob)
                  for m in markers:
                      if m in flipped:
                          print("RECOVERED %s from %s with XOR 0x%02x"
                                % (m.decode(), path, key))
                          bad = 1
          print("no single-byte XOR pass recovers a marker" if not bad else "")
          sys.exit(bad)
          PY

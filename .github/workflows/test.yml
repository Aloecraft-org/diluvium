name: Tests

# Runs the Lua test suite plus a few Diluvium-specific smoke checks.
#
# Three ways in:
#   * automatically on every push and pull request
#   * manually, against any commit, branch or tag  (Actions -> Tests -> Run workflow)
#   * called by release.yml as a gate before publishing

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to test (blank = the branch selected above)'
        type: string
        required: false
        default: ''
      include_skipped:
        description: 'Also run the normally-skipped tests (api, attrib, big, heavy, literals, main)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      include_skipped:
        type: boolean
        required: false
        default: false
    outputs:
      sha:
        description: 'The exact commit that was tested'
        value: ${{ jobs.resolve.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Pin the exact commit once, so every job below tests the same tree even if
  # the branch moves mid-run. This is what makes a manual run commit-specific
  # rather than branch-specific.
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      short_sha: ${{ steps.info.outputs.short_sha }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: info
        run: |
          set -eu
          SHA=$(git rev-parse HEAD)
          {
            echo "sha=$SHA"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
            echo "version=$(tr -d '[:space:]' < VERSION)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Commit under test"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| Version | \`$(tr -d '[:space:]' < VERSION)\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Subject | $(git log -1 --pretty=%s) |"
          } >> "$GITHUB_STEP_SUMMARY"

  suite:
    name: Suite (${{ matrix.name }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # macOS is advisory for now: the debug build has never been exercised there,
    # so a failure should surface without blocking the pipeline. Flip
    # experimental to false once it has been green for a few runs.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            experimental: false
          - name: macos-arm64
            os: macos-latest
            experimental: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build debug binary (with ltests.h assertions)
        run: make test_build

      - name: Run suite
        run: |
          ./test/run_tests.sh \
            --bin dist/diluvium_debug \
            --timeout 300 \
            ${{ inputs.include_skipped && '--include-skipped' || '' }}

      # The call driver has no guest binding, so run_tests.sh cannot reach it.
      # Same debug flags as the suite: 'api_check' is where its stack
      # arithmetic fails loudly instead of corrupting silently.
      - name: Run the call-driver contract tests
        run: make dtask_check

  patch-guard:
    name: Core patch guard
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0   # the fork-point commit must be reachable

      - name: Only allowlisted core files may diverge from upstream
        run: ./script/patch_series.sh check

      - name: Patch series generates and re-applies cleanly
        run: |
          set -eu
          ./script/patch_series.sh generate /tmp/series.patch
          mkdir -p /tmp/roundtrip/src
          for f in $(git ls-tree --name-only 7579fc9d7ed90240487251dfb69168f8e64e9294 | grep -E '\.(c|h)$'); do
            git show "7579fc9d7ed90240487251dfb69168f8e64e9294:$f" > "/tmp/roundtrip/src/$f"
          done
          cd /tmp/roundtrip && patch -p1 --quiet < /tmp/series.patch
          fail=0
          for f in src/*.c src/*.h; do
            cmp -s "$f" "$GITHUB_WORKSPACE/$f" || { echo "MISMATCH after re-apply: $f"; fail=1; }
          done
          exit $fail

      - name: Upload the generated series
        uses: actions/upload-artifact@v4
        with:
          name: core-patch-series-${{ needs.resolve.outputs.short_sha }}
          path: /tmp/series.patch
          retention-days: 90

  sanitizers:
    name: ASan + UBSan
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Not the ltests.h debug build: that installs its own allocator, which
      # would fight AddressSanitizer for the same job. This is an ordinary
      # build with the sanitizers on.
      - name: Build with sanitizers
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g \
            -DLUA_USE_LINUX -Wl,-E -ldl -o dist/diluvium_asan .data/onelua.c -lm
          gcc -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g \
            -o dist/luac_asan .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -DMAKE_LUAC -lm

      - name: Suite under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test/run_tests.sh --bin dist/diluvium_asan --timeout 900

      # The compiler and the analyzer walk instruction operands by hand, so
      # they are exactly where a decoding mistake hides. This is what caught
      # analyze.c reading OP_NEWTABLE with Lua 5.4's operand widths: the
      # guard against that is a debug-build assertion, so a release build
      # read the wrong bits without complaint.
      - name: Compiler and analyzer under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -eu
          for f in test/*.lua; do
            ./dist/luac_asan -r -o /dev/null "$f" >/dev/null
          done
          echo "analysed $(ls test/*.lua | wc -l) files with no sanitizer report"

  fuzz:
    name: Loader fuzz
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # The debug binary, not the release one: its allocator asserts on a
      # leak at exit and its GC checks are on, which is what makes the quiet
      # failures visible. Both loader bugs fixed in 5.5.1_build2 were found
      # this way rather than by the suite.
      - name: Build debug binary (with ltests.h assertions)
        run: make test_build

      # Fixed seeds, so a failure here is reproducible from the log rather
      # than being a thing that happened once. Rotate or add seeds to widen
      # coverage; do not randomise, or a red build cannot be re-run.
      - name: Mutate and load
        run: |
          set -eu
          for seed in 20260808 31337 65535 8675309; do
            ./dist/diluvium_debug script/fuzz_undump.lua 2000 "$seed"
          done

      # Loading a mutant is only half of it: corrupting an instruction
      # operand usually leaves a chunk that still loads, and the damage
      # appears when the VM runs it. fuzz_exec runs them.
      #
      # --allowed is a CEILING, not a target. It was 35 before the verifier
      # landed, then 3 for the residual SETLIST type assumption. That is now
      # closed by a runtime type-test in the VM (the one dataflow fact a
      # load-time verifier could not settle), so this is 0: a random-byte
      # mutation that loads and then crashes the release interpreter is a
      # regression, full stop. Never raise it to make a build green.
      - name: Build release binary
        run: make build_platform || make
      - name: Mutate, load and run
        run: |
          set -eu
          BIN=$(ls dist/diluvium_linux_x86_64 dist/diluvium 2>/dev/null | head -1)
          ./script/fuzz_exec.py --bin "$BIN" --rounds 200 --seed 7 --allowed 0

      # The attack-rate companion to fuzz_exec's accident rate. It finds the
      # code array and sets each instruction operand out of range for the
      # prototype that owns it -- exactly what the verifier checks -- so a
      # crash here means the verifier let an out-of-range operand through.
      # --allowed 0, and it stays there: this is the gate that says the
      # operand crash class is closed. (Measured off vs on: 111 crashes
      # become 0 on this corpus.)
      - name: Corrupt operands, load and run
        run: |
          set -eu
          BIN=$(ls dist/diluvium_linux_x86_64 dist/diluvium 2>/dev/null | head -1)
          ./script/fuzz_struct.py --bin "$BIN" --allowed 0

  changelog:
    name: Changelog
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Changelog tooling
        run: pip install --quiet pyyaml

      # CHANGELOG.yaml is the source of truth for the release page and for
      # the release mirror, so a mistake here is a mistake on a published
      # artifact. 'check' catches the committed CHANGELOG.md and
      # changelog.json drifting from it -- the mirror reads that JSON with
      # a stdlib-only Python, which is why it is committed rather than
      # generated on demand.
      - name: Changelog is valid and its generated copies are current
        run: |
          set -eu
          ./script/changelog.py validate
          ./script/changelog.py check

      # The newest entry describes the tree it sits in. The version lives
      # in three files here, so this is where drift between them surfaces.
      - name: Tree agrees with the newest entry
        run: ./script/changelog.py consistency

  analyzer:
    name: Analysis report
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build luac
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -o dist/luac .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -std=c99 -DMAKE_LUAC -lm

      - name: Generate and validate the report
        run: |
          set -eu
          # `luac -r <file>` writes the JSON report to luac.out.
          ./dist/luac -r test/analyze.lua
          python3 - <<'PY'
          import json, sys
          with open("luac.out") as fh:
              report = json.load(fh)
          for key in ("lua_version", "functions"):
              if key not in report:
                  sys.exit(f"analysis report is missing top-level key {key!r}")
          fns = report["functions"]
          if not isinstance(fns, list) or not fns:
              sys.exit("analysis report contains no functions")
          print(f"report OK: {len(fns)} functions, lua_version={report['lua_version']}")
          PY

      - name: Compile every test file (parser smoke check)
        run: |
          set -eu
          fail=0
          for f in test/*.lua; do
            if ! ./dist/luac -p "$f" >/dev/null 2>&1; then
              echo "parse failed: $f"
              fail=1
            fi
          done
          exit $fail

  obfuscation-audit:
    name: Obfuscation audit (advisory)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build luac
        run: |
          set -eu
          mkdir -p .data dist
          cp -r src/* .data/
          gcc -o dist/luac .data/onelua.c .data/analyze.c .data/diluvium_api.c \
            -std=c99 -DMAKE_LUAC -lm

      - name: Check that a ~function leaks nothing in plaintext
        env:
          # Strict since the fixes for handoff findings 3 (scramble length was
          # an instruction count, not a byte count), 4 (is_encrypted now
          # propagates to nested closures) and the saved-string leak (a
          # literal shared with ordinary code had one stored copy, in the
          # clear): any plaintext marker in a secure dump is a regression.
          STRICT: 'true'
        run: |
          set -eu
          # MARKER_SHARED_* are the interesting ones: 5.5 stores each distinct
          # string once and back-references it, so a literal a secure function
          # shares with ordinary code has a single stored copy at whichever
          # site was dumped first -- which is not always the secure one.
          cat > /tmp/secure_probe.lua <<'LUA'
          local shared_before = "MARKER_SHARED_ENCLOSING";
          -- the ';' matters: '~' is also binary xor, so a '~function' line
          -- following an expression is otherwise absorbed into it.
          ~function probe()
            local direct = "MARKER_DIRECT_CONSTANT"
            local nested = function() return "MARKER_NESTED_CONSTANT" end
            return direct, nested, "MARKER_SHARED_ENCLOSING", "MARKER_SHARED_SIBLING"
          end
          local function sibling() return "MARKER_SHARED_SIBLING" end
          return probe, sibling, shared_before
          LUA
          # Dump unstripped too: debug names of a secure function are strings
          # like any other, and -s would hide a leak in them.
          ./dist/luac -s -o /tmp/secure_probe.out /tmp/secure_probe.lua
          ./dist/luac -o /tmp/secure_probe_debug.out /tmp/secure_probe.lua

          leaked=0
          for marker in MARKER_DIRECT_CONSTANT MARKER_NESTED_CONSTANT \
                        MARKER_SHARED_ENCLOSING MARKER_SHARED_SIBLING; do
            if grep -qa "$marker" /tmp/secure_probe.out ||
               grep -qa "$marker" /tmp/secure_probe_debug.out; then
              echo "LEAKED   $marker  (present in plaintext in the dumped chunk)"
              leaked=1
            else
              echo "obscured $marker"
            fi
          done

          {
            echo "### Obfuscation audit"
            echo ""
            if [ "$leaked" -eq 0 ]; then
              echo "No plaintext markers found in the dumped secure chunk."
            else
              echo "Plaintext markers found in the dumped secure chunk."
              echo "Expected while handoff findings 3 and 4 are open."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$leaked" -eq 0 ]; then
            echo "no plaintext leaked"
          elif [ "$STRICT" = true ]; then
            echo "::error::secure chunk contains plaintext constants"
            exit 1
          else
            echo "::warning::secure chunk contains plaintext constants (known: handoff findings 3 and 4)"
          fi

      - name: Check that no single-byte XOR pass recovers the markers
        run: |
          set -eu
          # The grep above passes for any scramble at all, including one
          # repeated byte -- which it was until the keystream landed, leaving
          # the strings one 'tr' pass from readable. Sweeping all 256 keys
          # tests the shape of the encoding rather than a constant, so this
          # cannot pass again by accident if someone simplifies the scramble.
          python3 - <<'PY'
          import sys
          markers = [b"MARKER_DIRECT_CONSTANT", b"MARKER_NESTED_CONSTANT",
                     b"MARKER_SHARED_ENCLOSING", b"MARKER_SHARED_SIBLING"]
          bad = 0
          for path in ("/tmp/secure_probe.out", "/tmp/secure_probe_debug.out"):
              blob = open(path, "rb").read()
              for key in range(256):
                  flipped = bytes(b ^ key for b in blob)
                  for m in markers:
                      if m in flipped:
                          print("RECOVERED %s from %s with XOR 0x%02x"
                                % (m.decode(), path, key))
                          bad = 1
          print("no single-byte XOR pass recovers a marker" if not bad else "")
          sys.exit(bad)
          PY

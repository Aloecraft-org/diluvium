name: Docker images

# Builds the two publishable images -- the CLI (docker/Dockerfile.cli) and the
# browser demo (docker/Dockerfile.browser) -- and pushes them to GHCR.
#
# Three ways in, matching release.yml's idiom:
#   1. Push a tag matching v*            -- builds and publishes that tag.
#   2. Actions -> Docker images -> Run   -- a rehearsal by default (builds both
#      images, pushes nothing); set publish=true AND a version to push. Use
#      this to publish images for a tag whose release was cut by the Actions
#      bot (a bot-created tag does not fire the push trigger above).
#   3. A pull request touching the build -- builds both images, pushes nothing.
#
# GHCR auth is the run's own GITHUB_TOKEN (packages: write below); no secret to
# configure. Images land at ghcr.io/<owner>/diluvium and .../diluvium-demo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to tag, e.g. 0.15.0 or v0.15.0 (required to publish)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Push to GHCR. Leave off for a build-only rehearsal.'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'src/**'
      - 'web/**'
      - 'Makefile'
      - 'VERSION'

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            image: diluvium
            dockerfile: docker/Dockerfile.cli
            platforms: linux/amd64,linux/arm64
          - name: browser
            image: diluvium-demo
            dockerfile: docker/Dockerfile.browser
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      # Whether this run pushes and the version to tag: a tag push publishes
      # that tag (refs/tags/vX.Y.Z -> X.Y.Z); a manual run publishes only with
      # publish=true and a version; pull requests never push.
      - name: Decide whether to publish, and the version
        id: gate
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
               [ "${{ inputs.publish }}" = "true" ]; then
            v="${{ inputs.version }}"; v="${v#v}"
            [ -n "$v" ] || { echo "::error::publish=true needs a version input"; exit 1; }
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.gate.outputs.version }},enable=${{ steps.gate.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.gate.outputs.push == 'true' }}
            type=ref,event=pr

      - name: Build${{ steps.gate.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ steps.gate.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Build

# Produces the full set of platform artifacts for one specific commit, without
# publishing anything.
#
# Two ways in:
#   * manually  (Actions -> Build -> Run workflow), to get artifacts for any
#     commit, branch or tag without creating a release
#   * called by release.yml, which then attaches the same artifacts to a release
#
# Every artifact name carries the short commit SHA, so downloads from different
# runs never get confused with one another.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to build (blank = the branch selected above)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      sha:
        description: 'The exact commit that was built'
        value: ${{ jobs.resolve.outputs.sha }}
      short_sha:
        description: 'Short form of the built commit'
        value: ${{ jobs.resolve.outputs.short_sha }}
      version:
        description: 'Contents of the VERSION file at that commit'
        value: ${{ jobs.resolve.outputs.version }}
      bundle_artifact:
        description: 'Name of the artifact holding every platform binary plus checksums'
        value: ${{ jobs.bundle.outputs.artifact }}

permissions:
  contents: read

jobs:
  # Pin the exact commit once so every platform builds the identical tree.
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      short_sha: ${{ steps.info.outputs.short_sha }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: info
        run: |
          set -eu
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=12 HEAD)"
            echo "version=$(tr -d '[:space:]' < VERSION)"
          } >> "$GITHUB_OUTPUT"

  build-linux-and-wasm:
    name: Linux static + WASM
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Install QEMU (for ARM support)
        uses: docker/setup-qemu-action@v3

      - name: Build WASM
        run: make build_wasm

      # The browser target is not currently exercised by any release, so treat
      # it as advisory: a regression here should be visible but must not block
      # shipping the other artifacts. Make it blocking once it has been green.
      - name: Build wasm32-unknown-unknown (browser, advisory)
        continue-on-error: true
        run: make _wasm_unknown_build

      - name: Build Linux static (x86_64)
        run: make build_linux_static ARCHl=x86_64

      - name: Build Linux static (aarch64 / Raspberry Pi 3-5)
        run: |
          # --platform triggers QEMU emulation; ARCHl names the output file.
          make build_linux_static \
            PODMAN_RUN_ALPINE="podman run --rm --platform linux/arm64 -v $(pwd)/.data:/data -w /data alpine:latest" \
            ARCHl=aarch64

      - name: Build Linux static (armv7l / Pi Zero)
        run: |
          make build_linux_static \
            PODMAN_RUN_ALPINE="podman run --rm --platform linux/arm/v7 -v $(pwd)/.data:/data -w /data alpine:latest" \
            ARCHl=armv7l

      - name: Smoke test the x86_64 static binary
        run: |
          set -eu
          ./dist/diluvium_linux_static_x86_64 -v
          ./dist/diluvium_linux_static_x86_64 script/smoke.lua
          ./dist/diluvium_compiler_linux_static_x86_64 -v

      # aarch64 and armv7l were built here and shipped without ever being
      # run. QEMU and the container are already set up from building them,
      # so running the binary costs one more invocation each.
      - name: Smoke test the ARM static binaries
        run: |
          set -eu
          for spec in "linux/arm64 aarch64" "linux/arm/v7 armv7l"; do
            set -- $spec
            plat=$1; arch=$2
            bin="dist/diluvium_linux_static_$arch"
            [ -f "$bin" ] || { echo "::error::$bin missing"; exit 1; }
            echo "--- $arch (under QEMU)"
            podman run --rm --platform "$plat" -v "$(pwd):/w" -w /w \
              alpine:latest sh -c "./$bin -v && ./$bin script/smoke.lua"
          done

      # wasmtime, pinned: an unpinned runtime is one more thing that can
      # change under a build without anyone choosing it.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v27.0.0
        run: |
          set -eu
          url="https://github.com/bytecodealliance/wasmtime/releases/download"
          curl -sSL "$url/$WASMTIME_VERSION/wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz" \
            | tar -xJ
          sudo install -m755 \
            "wasmtime-$WASMTIME_VERSION-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version

      # The WASI module is published on every release and was, until now,
      # never executed anywhere. This runs the Diluvium constructs through
      # it and checks that benchmark instruction counts match the native
      # build -- counts are supposed to describe the bytecode rather than
      # the machine, and this is what makes that checkable.
      - name: Run the WASI artifact we ship
        run: |
          set -eu
          script/wasi_check.sh \
            --wasm dist/diluvium_wasi.wasm \
            --native ./dist/diluvium_linux_static_x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: diluvium-${{ needs.resolve.outputs.short_sha }}-linux-wasm
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install dependencies
        run: brew install readline

      - name: Build native
        run: |
          # Help clang find readline in its non-standard brew location.
          # ${VAR:+:$VAR} avoids a trailing colon when the variable is unset:
          # an empty entry in CPATH means "the current directory", which made
          # in-tree headers shadow SDK headers during `cd .data && gcc`.
          export CPATH="$(brew --prefix readline)/include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="$(brew --prefix readline)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          make build_platform

      - name: Smoke test
        run: |
          set -eu
          BIN=$(ls dist/diluvium_darwin_* | grep -v '\.a$' | grep -v compiler | head -1)
          "$BIN" -v
          "$BIN" script/smoke.lua

      - uses: actions/upload-artifact@v4
        with:
          name: diluvium-${{ needs.resolve.outputs.short_sha }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows (MSYS2 MINGW64)
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          # Set these explicitly: the MSYS uname is long and ugly
          # ("mingw64_nt-10.0..."), which would leak into the filenames.
          make build_platform UNAME_Sl=windows ARCHl=x86_64
          ls -l dist/

      - name: Smoke test
        shell: msys2 {0}
        run: |
          set -eu
          ./dist/diluvium_windows_x86_64.exe -v
          ./dist/diluvium_windows_x86_64.exe script/smoke.lua

      - uses: actions/upload-artifact@v4
        with:
          name: diluvium-${{ needs.resolve.outputs.short_sha }}-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Collect every platform artifact into one bundle with a build manifest and
  # checksums. This is what release.yml attaches to the release, and what you
  # want to download after a manual build.
  bundle:
    name: Bundle + checksums
    needs: [resolve, build-linux-and-wasm, build-macos, build-windows]
    runs-on: ubuntu-latest
    outputs:
      artifact: diluvium-${{ needs.resolve.outputs.short_sha }}-all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: diluvium-${{ needs.resolve.outputs.short_sha }}-*
          merge-multiple: true
          path: release_dist

      - name: Write build manifest and checksums
        run: |
          set -eu
          cd release_dist
          # Keep the manifest and checksum file out of their own checksums.
          rm -f BUILDINFO.txt SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's| \./| |' > SHA256SUMS.txt
          cd ..

          {
            echo "Diluvium build manifest"
            echo "======================="
            echo "version    : ${{ needs.resolve.outputs.version }}"
            echo "commit     : ${{ needs.resolve.outputs.sha }}"
            echo "subject    : $(git log -1 --pretty=%s ${{ needs.resolve.outputs.sha }})"
            echo "committed  : $(git log -1 --pretty=%cI ${{ needs.resolve.outputs.sha }})"
            echo "built      : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run        : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Artifacts"
            echo "---------"
            cat release_dist/SHA256SUMS.txt
          } > release_dist/BUILDINFO.txt

          cat release_dist/BUILDINFO.txt

      # Sizes, timings and benchmarks -- none of which BUILDINFO.txt
      # carried. It ships as a release asset, so every release is a
      # permanent data point and history needs no branch to push to.
      #
      # Benchmarks run under the x86_64 static binary, the one artifact
      # this runner can execute natively. The comparable figure is the VM
      # instruction count, which is deterministic, so it means the same
      # thing whichever runner happened to pick the job up.
      - name: Build statistics
        run: |
          set -eu
          BENCH=release_dist/diluvium_linux_static_x86_64
          if [ -x "$BENCH" ]; then
            script/build_stats.sh record --dist release_dist \
              --bench "./$BENCH" --out release_dist/BUILDSTATS.json
          else
            echo "::warning::no x86_64 static binary; recording sizes only"
            script/build_stats.sh record --dist release_dist \
              --out release_dist/BUILDSTATS.json
          fi
          cat release_dist/BUILDSTATS.json

      # Against the last release, so a size jump is attributed while the
      # change that caused it is still in hand. Best effort: the first
      # release, or a run without one, simply has nothing to compare to.
      - name: Compare with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release download --pattern BUILDSTATS.json --dir prev 2>/dev/null; then
            {
              echo "### Size against the previous release"
              echo ""
              echo '```'
              script/build_stats.sh compare prev/BUILDSTATS.json release_dist/BUILDSTATS.json || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no previous BUILDSTATS.json to compare against" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Job summary
        run: |
          {
            echo "### Build ${{ needs.resolve.outputs.version }} @ \`${{ needs.resolve.outputs.short_sha }}\`"
            echo ""
            echo "| Artifact | Size | SHA256 |"
            echo "| :--- | ---: | :--- |"
            while read -r sum name; do
              bytes=$(wc -c < "release_dist/$name" | tr -d ' ')
              printf "| \`%s\` | %s KB | \`%s\` |\n" \
                "$name" "$(awk -v b="$bytes" 'BEGIN{printf "%.1f", b/1024}')" \
                "$(printf '%s' "$sum" | cut -c1-16)..."
            done < release_dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: diluvium-${{ needs.resolve.outputs.short_sha }}-all
          path: release_dist/*
          if-no-files-found: error
          retention-days: 90

# Dev builds and nightlies -- doc/ALIGNMENT.md 7.
#
# A '-dev.<n>' tag gets a specific commit into someone's hands without the
# ten-minute gate and without a hash in the version string. The hash is in
# BUILDINFO.txt, which is what lets the version stay short.
#
# Three ways in, and they differ only in what decides to run:
#
#   push to main       every merge, so there is always something to build
#                      DRT against between releases
#   schedule           nightly, and skipped when HEAD has not moved since the
#                      last dev tag -- otherwise identical builds accumulate
#   workflow_dispatch  any ref, so a branch can be cut for someone to try
#
# What this is NOT: the release path. release.yml and docker.yml both exclude
# 'v*-dev.*' from their tag triggers, so nothing here can reach them. 7 says a
# dev tag "builds one platform and skips cross-compilation, wasm and the slow
# suites"; that is why this calls the fast checks directly rather than the full
# matrix, and why it never touches the main release mirror.
#
# Configurable values, all here at the top rather than spread through the jobs:
#   NIGHTLY_CRON   when the nightly fires (UTC)
#   FAST_CHECKS    the suites a dev build runs
name: Dev build

on:
  push:
    branches: ['main']
  schedule:
    # 03:17 UTC. Not on the hour: a scheduled run competes with everyone
    # else's for a runner, and GitHub drops schedules it cannot start rather
    # than queueing them.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to cut (blank = this branch)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

# One dev build at a time. Two runs allocating a tag number at once would
# both read the same highest tag and both try to claim n+1; the loser's push
# fails rather than silently reusing a number, but serialising is cheaper
# than explaining that failure.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  decide:
    name: Allocate the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Every tag, because the counter is derived from them. A shallow
          # clone would read no tags and allocate dev.1 forever.
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Skip a nightly whose HEAD has not moved. Only for 'schedule': a
          # push and a dispatch are someone asking for this commit, and
          # answering "you already have it" would be unhelpful.
          LAST=$(git tag --list 'v*-dev.*' \
                 | sed -n 's/.*-dev\.\([0-9][0-9]*\)$/\1 &/p' \
                 | sort -n | tail -1 | cut -d' ' -f2- || true)
          if [ "$EVENT" = schedule ] && [ -n "$LAST" ]; then
            if [ "$(git rev-list -n1 "$LAST")" = "$SHA" ]; then
              echo "::notice::HEAD is unchanged since $LAST; nothing to build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # The same allocation 'make dev-tag' prints, run here so the number
          # is read at the moment it is claimed rather than whenever someone
          # last looked. 'sort -n' and not 'sort': the bug appears at dev.10,
          # where a lexical sort puts it before dev.9 and the counter walks
          # backwards.
          TAG=$(make -s dev-tag)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. The counter should never reuse a number."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Cutting $TAG at $SHA"

  check:
    name: Fast checks
    needs: decide
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Changelog tooling
        run: pip install --quiet pyyaml

      # The gate a dev build does keep. It is seconds, and it is the one that
      # catches a VERSION, .technoproj and CHANGELOG.yaml that disagree --
      # which is exactly what a dev build's own version string depends on.
      - name: The changelog agrees with the tree
        run: |
          set -eu
          script/changelog.py validate
          script/changelog.py consistency

      # 7: "a dev tag builds one platform and skips cross-compilation, wasm
      # and the slow suites". These are the contract tests for the surfaces a
      # host actually calls, and they run in about a minute together.
      - name: Contract tests
        run: |
          set -eu
          for t in dv_check dtask_check dshim_check dsnap_check dvs_check; do
            echo "=== $t"
            make "$t"
          done

  build:
    name: Build
    needs: [decide, check]
    if: needs.decide.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.decide.outputs.sha }}

  publish:
    name: Publish the prerelease
    needs: [decide, check, build]
    if: needs.decide.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_artifact }}
          path: dist

      # The notes come from the changelog's newest entry, and specifically
      # from changelog.json's 'notes_md' -- the rendered Markdown travels with
      # each entry so a consumer needs no renderer, which is why that field
      # exists. Read by index rather than looked up by tag: the entry names
      # the version being developed ('0.17.0-dev.1'), while this tag carries
      # the global counter, so after the first nightly the two no longer
      # match. That divergence is intended -- 7 keeps the counter out of the
      # tree precisely so a nightly needs no commit.
      - name: Release notes
        run: |
          set -eu
          jq -r '.releases[0].notes_md' changelog.json > notes.md
          {
            echo
            echo '---'
            echo
            echo '**This is a development build, not a release.** It was cut'
            echo "from \`${{ needs.decide.outputs.sha }}\` on"
            echo "\`${{ github.ref_name }}\`, and the entry above describes the"
            echo 'version being developed rather than this build specifically.'
            echo 'See `BUILDINFO.txt` in the assets for the exact commit.'
            echo
            echo 'Not in the release mirror, and not a candidate: see'
            echo '`doc/ALIGNMENT.md` §7.'
          } >> notes.md
          cat notes.md

      - name: Tag
        run: |
          set -eu
          git tag "${{ needs.decide.outputs.tag }}" "${{ needs.decide.outputs.sha }}"
          git push origin "${{ needs.decide.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          name: ${{ needs.decide.outputs.tag }}
          body_path: notes.md
          # Always. 7 is unconditional about this: a dev build is never a
          # candidate, whatever the changelog's 'stable' field says, because
          # that field describes the version being developed and not this cut
          # of it.
          prerelease: true
          draft: false
          files: dist/**

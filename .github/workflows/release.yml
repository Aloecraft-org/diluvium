name: Release

# Builds and (optionally) publishes a release for one specific commit.
#
# Two ways in:
#
#   1. Push a tag matching v*  -- builds that tag and publishes it.
#
#   2. Actions -> Release -> Run workflow. Pick the commit, the tag name, and
#      whether to publish. `publish` defaults to false, so a manual run is a
#      full release rehearsal by default: it runs the tests, builds every
#      platform, and leaves the artifacts on the run without touching the
#      Releases page. Set publish=true when you actually want it out.
#
# The tag is created at the resolved commit, so you can cut a release from any
# commit without checking it out or moving a branch first.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to release (blank = the branch selected above)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Tag name for the release, e.g. v5.5.1_build1 (required when publishing)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish to the Releases page. Leave off for a build-only rehearsal.'
        type: boolean
        required: false
        default: false
      draft:
        description: 'Create the release as a draft'
        type: boolean
        required: false
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        required: false
        default: true
      run_tests:
        description: 'Run the test suite before building'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Fail fast on bad input rather than after a 40-minute cross-platform build.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      draft: ${{ steps.check.outputs.draft }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -eu
          VERSION=$(tr -d '[:space:]' < VERSION)

          if [ "$EVENT" = push ]; then
            # The tag already exists -- that is what triggered this run.
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH=true
            DRAFT=false
            case "$VERSION" in *rc*|*alpha*|*beta*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          else
            TAG="$IN_TAG"
            PUBLISH="${IN_PUBLISH:-false}"
            DRAFT="${IN_DRAFT:-true}"
            PRERELEASE="${IN_PRERELEASE:-true}"

            if [ "$PUBLISH" = true ] && [ -z "$TAG" ]; then
              echo "::error::publish=true requires a tag name."
              exit 1
            fi

            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag '$TAG' already exists. Pick a new tag, or delete the old one first."
              exit 1
            fi
          fi

          # Advisory only: the tag and the VERSION file drifting apart is
          # usually a mistake, but not always (hotfix tags, re-cuts).
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::warning::tag '$TAG' does not match the VERSION file ('v$VERSION')."
          fi

          {
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
            echo "draft=$DRAFT"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release preflight"
            echo ""
            echo "| | |"
            echo "| :--- | :--- |"
            echo "| VERSION file | \`$VERSION\` |"
            echo "| Tag | \`${TAG:-(none)}\` |"
            echo "| Publish | \`$PUBLISH\` |"
            echo "| Draft / pre-release | \`$DRAFT\` / \`$PRERELEASE\` |"
            echo "| Commit | \`$(git rev-parse HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    needs: preflight
    # Tag pushes always test; manual runs test unless explicitly told not to.
    if: github.event_name == 'push' || inputs.run_tests
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  build:
    name: Build
    needs: [preflight, test]
    # `always()` lets the build proceed when the test job was skipped by the
    # run_tests=false toggle, while still stopping on an actual test failure.
    if: always() && needs.preflight.result == 'success' && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  publish:
    name: Publish release
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_artifact }}
          path: release_dist

      - name: Generate release notes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -eu
          have() { [ -f "release_dist/$1" ]; }
          row() { have "$1" && printf '| %s | `%s` | %s |\n' "$2" "$1" "$3" >> release_notes.md || true; }

          {
            echo "Diluvium \`$VERSION\` — a fork of Lua 5.5.1 with string"
            echo "interpolation and format specs, null coalescing, safe"
            echo "navigation, compound assignment, \`switch\`, \`defer\`,"
            echo "\`with\`, obfuscated functions and a bytecode analysis"
            echo "report."
            echo ""
            echo "Built from commit [\`$(echo "$SHA" | cut -c1-12)\`](${{ github.server_url }}/${{ github.repository }}/commit/$SHA)."
            echo ""
            echo "## Download guide"
            echo ""
            echo "| Platform | File | Notes |"
            echo "| :--- | :--- | :--- |"
          } > release_notes.md

          row diluvium_linux_static_x86_64     "**Linux (standard)**"    "Static; works on Ubuntu, Fedora, CentOS, Arch"
          row diluvium_linux_static_aarch64    "**Raspberry Pi 3/4/5**"  "64-bit OS only"
          row diluvium_linux_static_armv7l     "**Raspberry Pi Zero**"   "32-bit ARM"
          row diluvium_darwin_arm64            "**macOS (Apple silicon)**" "M1/M2/M3/M4"
          row diluvium_darwin_x86_64           "**macOS (Intel)**"       ""
          row diluvium_windows_x86_64.exe      "**Windows**"             "64-bit"
          row diluvium_wasi.wasm               "**WASI**"                "Run with wasmtime or another WASI runtime"
          row libdiluvium_wasm_unknown.a       "**Browser**"             "wasm32-unknown-unknown static library"

          {
            echo ""
            echo "Each platform also ships a \`diluvium_compiler_*\` binary (\`luac\`"
            echo "with the \`-r\` analysis report flag) and a \`libdiluvium_*.a\` static"
            echo "library for embedding."
            echo ""
            echo "## Verifying a download"
            echo ""
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
            echo ""
            echo "\`BUILDINFO.txt\` records the exact commit, build time and workflow run."
            echo ""
            echo "---"
            echo ""
          } >> release_notes.md

          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: Diluvium ${{ needs.build.outputs.version }}
          files: release_dist/*
          body_path: release_notes.md
          generate_release_notes: true
          draft: ${{ needs.preflight.outputs.draft == 'true' }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

  # Make the outcome of a rehearsal run obvious from the run page.
  summary:
    name: Summary
    needs: [preflight, build, publish]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Release run complete"
            echo ""
            echo "- Version: \`${{ needs.build.outputs.version }}\`"
            echo "- Commit: \`${{ needs.build.outputs.sha }}\`"
            echo "- Artifact: \`${{ needs.build.outputs.bundle_artifact }}\`"
            if [ "${{ needs.preflight.outputs.publish }}" = "true" ]; then
              echo "- Published to the Releases page as \`${{ needs.preflight.outputs.tag }}\`."
            else
              echo "- **Not published.** This was a build-only rehearsal; download"
              echo "  the artifact above, or re-run with \`publish\` enabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

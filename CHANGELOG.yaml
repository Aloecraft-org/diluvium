# Diluvium changelog -- the source of truth for release notes.
#
# This file, not the GitHub release body, is what a release page and the
# release mirror should be generated from. Edit it here; everything
# downstream is derived.
#
# Shape follows keepachangelog.com 1.1.0, with the six standard sections
# kept under their own names so the mapping to Markdown is mechanical.
# Bullets are ordinary strings; any of them may be a `|` block when the
# detail earns it, in which case the first line is the headline.
#
#   version           Diluvium version, without the leading `v`.
#   tag               Git tag. ALWAYS explicit, never derived from
#                     `version`: this repository also carries upstream
#                     Lua's tags, so `v5.4.7` and `v5.5.0` are Lua's and
#                     Diluvium's are the suffixed ones. Deriving
#                     `v{version}` silently resolves to upstream's tag.
#   date              ISO date published; null when unreleased.
#   status            released | unreleased | tagged
#                     `tagged` means the tag exists but no GitHub release
#                     was published for it.
#   stable            A real release rather than a candidate. This field is
#                     the truth and GitHub's `prerelease` flag is derived
#                     from it: `release.yml`'s preflight reads it through
#                     `changelog.py release-check` and then PATCHes the flag
#                     after publishing, because the release action will set
#                     that flag but not clear it. Historically every release
#                     here was flagged false regardless, candidates
#                     included; that is what the derivation fixed.
#                     False is not only for candidates. A release whose
#                     supported configuration is narrower than the feature
#                     set it ships is not stable either, and 5.5.1_build3 is
#                     the first of those.
#   latest            Optional. Exactly one entry carries `latest: true`;
#                     that is what a `latest/` path should resolve to.
#   mirror            Whether the release mirror should carry it. This
#                     replaces the hand-maintained MIRROR_TAGS and
#                     MIRROR_LATEST environment pins.
#   lua_base          The upstream Lua release this was forked from.
#   bytecode_format   LUAC_FORMAT. Chunks only load into a build carrying
#                     the same byte, so a change here is a hard break and
#                     belongs in `upgrading`.
#   summary           Prose block heading the release.
#   upgrading         Optional. Anything a user must do to move to it.
#   known_issues      Optional. Problems present in this version, recorded
#                     against the version they affect rather than only
#                     against the one that fixes them.
#   added / changed / deprecated / removed / fixed / security
#                     The keepachangelog sections. Omit what is empty.
#
# The January 5.4.7 candidates (v5.4.7_rc, _rc2, _rc3) are represented by
# the single 5.4.7-rc4 entry below; they shipped no notes and differ only
# in build fixes.

schema: 1
repo: Aloecraft-org/diluvium

releases:
  - version: "5.5.1_build5"
    tag: v5.5.1_build5
    date: null
    status: unreleased
    stable: true
    mirror: false
    lua_base: "5.5.1"
    bytecode_format: 0x46
    summary: |
      **Hibernation is on, and `stable` is true again.**

      5.5.1_build4 shipped `stable: false` for exactly one reason: an
      ungated `dv_restore` with a known corruption path. That block --
      profile C of the M0-M7 audit, hibernation at scale -- is closed.
      Every confirmed finding from the audit is now fixed, each with a
      named test that fails when its fix is removed, and hibernation is
      on by default: park an instance, snapshot it, free it, restore the
      bytes into a fresh instance and resume, with the failure paths as
      tested as the happy one. A restored program that raises gets the
      right error with a traceback; a restored `pcall` still catches and
      re-arms the handler it displaced; a woken runaway is stopped with
      both residencies charged against the one instruction budget; an
      endpoint reference held across the gap still binds; and a
      malformed snapshot is refused, never a crash -- the fuzzer's
      known-failure set is empty and stays that way.

      `dvs_allow_hibernation` survives as a host's opt-out. The comment
      that made it off by default is struck rather than edited, which is
      what its own text asked for.

      The release also builds out the host story. `doc/Hostcall.md`
      reserves the hostcall encoding -- correlation token required from
      the first prototype -- and `doc/Host.md` states the protocol both
      planned hosts implement, the lab JavaScript host and the generic C
      one, with the acceptance test that a guest cannot tell them apart.
      The swarm layer reaches WebAssembly: a new
      `diluvium_swarm_wasi.wasm` carries it with the host vtable crossing
      the boundary as "env" imports, so a swarm can be driven by a
      JavaScript host -- which is what lab picks up. And the generic host
      itself now exists (`host/`, `make build_host`): a deployment is a
      supervisor program plus a typed `*.host.lua` configuration, not C,
      with connectors for the wall clock, SQLite and an HTTP listener,
      each off until wired and gated by the capability grammar.

    upgrading: |
      **Snapshots taken by 5.5.1_build3 or 5.5.1_build4 are refused by
      this release.** Three stream changes land together so the cost is
      paid once: the snapshot header carries the instruction count
      (`DILUVIUM_SNAP_FORMAT` 2), the thread record carries the error
      handler slots (`DS_THREAD_VERSION` 2), and the endpoint reference
      metatable joins the permanents set, which moves the permanents
      fingerprint. A restore of older bytes fails cleanly with the
      format-mismatch sentence; nothing half-loads. There is no
      converter, deliberately: those releases said to treat
      `dv_snapshot`/`dv_restore` as unsupported, so bytes from them are
      exactly the thing a refusal is for.

      **Bytecode is unaffected.** `LUAC_FORMAT` is unchanged at 0x46;
      chunks compiled by build3 or build4 load without recompiling.

      **Hibernation is on by default.** A swarm that relied on the old
      refusal as policy should call `dvs_allow_hibernation(sw, 0)`; a
      host that called it with 1 keeps working unchanged. The opt-out's
      refusal names the call that switched it off rather than pointing
      at a defect that no longer exists.

      **`endpoint.bind`'s failure message changed.** It now says the
      value "does not carry this runtime's reference identity" instead
      of asserting the program built the value itself -- the old text
      was false in exactly the case this release fixes. A program
      matching on the old wording needs updating; matching on error
      prose was never promised to survive.

    added:
      - |
        **The generic host** (`host/`, `make build_host`): the host
        protocol as one configurable binary, so a deployment is a
        supervisor program plus a `*.host.lua` configuration rather than
        bespoke C. The config is Lua's syntax without its power --
        evaluated in an empty environment, every unknown key refused by
        name -- and typed by a LuaCATS schema (`host/types/host.lua`).
        Three connectors, all off until wired and each gated by a
        `host:` capability the same way queues are gated: the wall clock,
        SQLite (`sql/query` reads, `sql/exec` writes, confined to one
        file by an authorizer), and an HTTP listener behind a
        TLS-terminating load balancer (a request is a message, a message
        is a response, `conn` echoed like a hostcall token).
        `examples/discofetch/swarmd.c` is the bespoke ancestor this
        retires.
      - |
        **The swarm layer reaches WebAssembly.** `dvs.c` joins both wasm
        archives, and `diluvium_swarm_wasi.wasm` is a new artifact
        carrying it plus `dvs_shim.c`: a JavaScript host cannot make the
        C function pointers `dvs_new` wants, so the trampolines live on
        the C side as mandatory "env" imports and `dvsjs_new` stands in
        as the constructor. A separate module on purpose -- mandatory
        imports linked into `diluvium_wasi.wasm` would have broken
        `wasmtime diluvium_wasi.wasm` and every other pure-WASI
        consumer, which keep the module they had. The JS binding always
        supplies the trampolines, `setSwarmHost` installs the real host,
        and `instantiate` is exported as the layer a host builds on.
      - |
        `dvs_set_host_identity`: a swarm can hold an identity, and every
        snapshot it takes carries it. A foreign stamp is refused at
        wake, and so is a missing one on a stamped host -- 10.10's
        asymmetry, now true of the swarm layer and not only the ABI
        under it. Not authentication; a label that fails loudly.
      - |
        `diluvium_snap_headerusage`: read a snapshot's instruction count
        from its header without restoring it. In the header rather than
        the payload so a host deciding whether it can afford to wake a
        cached instance can ask the bytes -- the same reasoning that
        made the budget a query at the swarm layer.
      - |
        `doc/Hostcall.md` and `doc/Host.md`: the hostcall request/reply
        encoding with the correlation token reserved before any host
        ships a handler, and the host protocol -- construction, drive
        loop, roster, queue pump, hostcalls, hibernation policy,
        shutdown -- written so the lab JavaScript host and the generic C
        host are two implementations of one contract.
      - |
        Tests for every path the audit found untested, each verified to
        fail with its fix removed: a woken instance still budgeted (the
        test that never existed), a restored program's traceback, a
        restored `pcall`'s handler chain, all four host-identity stamp
        quadrants, a nested coroutine refused by name and capturable
        once dropped, an endpoint reference surviving hibernation, and a
        woken program re-binding its own endpoint with ordering held
        across the gap.

    changed:
      - |
        Hibernation is on by default; `dvs_allow_hibernation` is a
        host's opt-out. The swarm's budget test the audit caught
        certifying only readback now wakes what it caches and asserts
        the counter came through.
      - |
        The snapshot fuzzer labels mutants with the format-2 record
        layout and its known-failure set is empty -- audit S2's two
        crashers are refusals now, and adding an entry to that set needs
        a better reason than a red run.
      - |
        Refusal sentences widened where the checks did: a to-be-closed
        slot can be refused for holding nothing closable, a permanents
        mismatch speaks of named values rather than only C functions,
        and restore refusals gained their own distinctness test.

    fixed:
      - |
        **Any error raised in any restored program corrupted memory**
        (audit finding 0, the reason hibernation shipped off). The
        thread record now round-trips what it dropped, and
        `a_restored_program_can_raise` -- the first test in the tree to
        ever resume a restored thread into an error -- holds it.
      - |
        A woken instance's instruction budget was never re-armed, and
        the counter did not travel, so a budget quietly became
        per-residency (finding 1). `dv_restore` arms the count hook and
        the header carries `insn_used`; both residencies charge one
        limit.
      - |
        A restored program's error was correct but bare (old_errfunc).
        The record carries the thread's error-handler slot and each
        pcall frame's saved one, in slot units so the stream does not
        depend on a build's `sizeof`; validation refuses rather than
        asserts, which is S2's lesson applied ahead of time.
      - |
        Two malformed snapshots reached an abort instead of a refusal
        (audit S2). A crafted to-be-closed list naming a non-closable
        slot reached the raise inside `luaF_newtbcupval`, which escapes
        the lock convention -- one extra unlock, the counter at -1, the
        opposite of the leaked lock the audit predicted at the same
        site. `diluvium_shim_settbc` refuses it first now; the full
        corpus runs 0 crashed.
      - |
        Nested coroutines were captured rather than refused (finding
        14). A program parked holding a suspended coroutine is refused
        by name and told what to do -- let it finish or drop it -- and
        the same program snapshots once it has.
      - |
        An endpoint reference did not survive a snapshot, and `bind`
        refused it with a false statement (finding 12). The reference
        metatable is the permanent `dendpoint.refmt`; `bind` adopts an
        endpoint queue no token claims, which is how a woken program
        re-binds its own endpoint and the only route by which the
        host's drain path returns after a wake; and messages buffered
        before a hibernate drain out in order after it.
      - |
        A crafted to-be-closed count could send record reads four
        gigabytes out of bounds on platforms with a 32-bit `unsigned
        long` (pre-existing; LP64 was never affected). Every marked
        slot is a distinct stack slot, so a count above the slot count
        is refused as not credible.

    known_issues:
      - |
        **A sealed program still has no way to ask for the time -- but
        the encoding it will use is now fixed.**

        The hostcall needs no ABI: it is a message on a queue the host
        drains and an answer on a queue it pushes to, and
        `doc/Hostcall.md` now reserves the request and reply shapes with
        the correlation token required from the first prototype. What
        does not exist yet is any host that connects a call: until one
        ships, a program that genuinely needs a clock or a file has
        `DV_FLAG_UNSAFE_STDLIB` and nothing better, which is exactly why
        that flag is scaffolding rather than a configuration.

      - |
        `DV_FLAG_UNSAFE_DEBUG` is a real hole, deliberately.

        Unchanged from 5.5.1_build4: a host that sets it gets the whole
        `debug` library back and, with it, the endpoint forgery route
        and the budget escape. Supported for trusted code; recorded in a
        test rather than only here.

      - |
        **The swarm's snapshot cache is in-memory only, and the swarm's
        own topology has no serializer.** A host may persist any
        instance's snapshot bytes and restore them after a process
        restart -- the header checks make stale or foreign bytes a
        refusal, never a corruption -- but recording which bytes
        belonged to what, and every parent, capability and budget
        relationship around them, is the host's own bookkeeping.
        Instance ids restart with a new swarm, so ids a program
        remembers from a previous life are volatile and must not be
        trusted across generations.

      - |
        The rebuilt `u2.funcidx` of a restored vararg pcall frame
        differs from the organic value by the argument count -- the
        "agree by construction" claim at the reconstruction site is
        measurably false for vararg callees. Benign on every tested
        path, recorded in `doc/Hibernate.md` so nobody extending the
        frame rebuild trusts the comment.


  - version: "5.5.1_build4"
    tag: v5.5.1_build4
    date: 2026-08-11
    status: released
    stable: false
    mirror: true
    lua_base: "5.5.1"
    bytecode_format: 0x46
    summary: |
      **The capability layer becomes a boundary.**

      5.5.1_build3 shipped as a pre-release for two stated reasons:
      hibernation was switched off, and the capability layer was a
      structuring device rather than a security boundary, because a program
      could reach past it through the `debug` library. This release closes
      the second one. A program loaded into an instance can no longer forge
      an endpoint reference, read the runtime's registry, walk past a
      protected metatable, or switch off the instruction budget it was given.

      That last one was not on anyone's list. A `lua_State` has one hook slot
      and the instruction budget is a count hook in it, so `debug.sethook()`
      -- the documented way to clear a hook, one line, no setup -- disarmed
      it: an instance limited to 200,000 instructions ran three million and
      reported nought used. It was found while closing the forgery route and
      is closed by the same change.

      **Still a pre-release, and now for one reason rather than two.**
      Hibernation is off by default and should stay off; the defect behind
      that switch is unchanged and is described under **Known issues**. Every
      other confirmed finding from the M0-M7 audit that is not part of
      hibernation is now fixed -- twenty-nine of thirty-five, and the six
      that remain are hibernation entire.

      **An instance is now sealed by default**, and that is the change most
      likely to affect you. Section 18.2 said the `debug` library was the one
      item between a deployment and running programs it did not write. That was
      wrong: `dv_new` opened every standard library, so an instance also had
      `os.execute`, `io.popen`, `io.open`, `package.loadlib`, `dofile` and
      `loadfile`, and a program that can start a process has no need to forge an
      endpoint reference.

      It is a default rather than a flag because it is what the design already
      said. An instance reaches outside itself by yielding a request its host
      answers -- `queue.wait` is that, and `doc/Determinism.md` calls the general
      form a hostcall. `io`/`os`/`package` were a second boundary that arrived by
      inheriting `luaL_openlibs` and was never decided anywhere. Having them
      costs more than the obvious: the instruction budget stops meaning anything
      (a subprocess costs no VM instructions) and the swarm stops being
      replayable (inputs stop arriving through the message log), and neither
      failure announces itself.

      Beyond that: four checks that reported success without checking
      anything, and a defect where destroying an endpoint queue made its
      token permanently unusable.

    upgrading: |
      **A program running inside an instance now gets a narrowed `debug`
      library.** This is the one change here that can break working code.

      Twelve of its sixteen functions raise instead of running: `debug`,
      `getregistry`, `getmetatable`, `setmetatable`, `getupvalue`,
      `setupvalue`, `upvalueid`, `upvaluejoin`, `getuservalue`,
      `setuservalue`, `sethook` and `setlocal`. Each names what it would have
      defeated, so a program that hits one reports something a human can act
      on rather than "attempt to call a nil value". `getinfo`, `getlocal`,
      `gethook` and `traceback` are unchanged: a program may read its own
      frames.

      This applies to instances only -- states created by `dv_new`, which
      includes every child the swarm layer spawns. The `diluvium` and
      `diluvium_compiler` binaries, the browser build and anything embedding
      the runtime through `luaL_openlibs` are unaffected, and the upstream
      test suite still drives the whole library.

      A host that wants the old behaviour sets `DV_FLAG_UNSAFE_DEBUG` in
      `dv_config.flags`. Do that only where the program is one you wrote or
      generated yourself: it restores the forgery route, the registry and the
      budget escape together, which is why it is spelled that way.

      Snapshots are unaffected. The twelve names are still present -- they
      are refusals, not deletions -- so the permanents fingerprint is
      unchanged and a snapshot taken by 5.5.1_build3 still restores. A
      snapshot also crosses `DV_FLAG_UNSAFE_DEBUG` in both directions, and
      the permanent resolves in the restoring instance, so a program captured
      holding `debug.sethook` wakes with whichever one the instance it wakes
      in is entitled to.

      **An instance no longer has `io`, `os` or `package`, nor `dofile` and
      `loadfile`.** This is the breaking change in this release.

      Nothing fails at load time -- sealing cannot be checked statically -- so
      a program that uses `os` reports `attempt to index a nil value (global
      'os')` when it reaches that line, and a program whose only use is on an
      error path will not fail until that path runs. Grep your programs for
      `os.`, `io.`, `package.`, `require`, `dofile` and `loadfile` rather than
      relying on a test pass.

      Two ways forward. Prefer handing the program what it needs through a
      queue: section 8.3 already says the host owns the clock, and a value that
      arrives as a message is one that can be replayed and faked in a test.
      Failing that, set `DV_FLAG_UNSAFE_STDLIB` (`unsafe_stdlib` in Rust and
      Python, `unsafeStdlib` in JavaScript, `dvs_allow_unsafe_stdlib` for a
      swarm) and understand that it makes `dv_usage` approximate and the swarm
      non-replayable.

      A program that feature-detects -- `if os and os.time then` -- keeps
      working and takes its own fallback, which is why the libraries are
      removed rather than replaced with stubs that raise.

      `print` is unaffected; it is in the base library and does not go through
      `io`.

      `LUAC_FORMAT` is unchanged at 0x46; chunks compiled by 5.5.1_build3
      load without recompiling.

    added:
      - |
        `DV_FLAG_UNSAFE_STDLIB` in `dv_config.flags`: put `io`, `os` and
        `package` back, with `dofile` and `loadfile`. **Scaffolding for
        programs that predate the sealed default, not a supported
        configuration** -- see **Changed** and **Upgrading**.

        A snapshot does not cross this flag: the permanents fingerprint covers
        the module tables, so a sealed instance and an unsealed one disagree
        and `dv_restore` refuses with the permanents-set message. That is the
        right answer -- a program captured holding `io.open` cannot wake
        somewhere there is none. It *does* cross `DV_FLAG_UNSAFE_DEBUG`,
        because there the names are all still present.

      - |
        `dvs_allow_unsafe_stdlib` in the swarm layer, and flag attenuation
        with it.

        Flags were the one authority in that layer that did not narrow:
        `build` zeroed its `dv_config` and never consulted the parent, so a
        sealed supervisor spawned children that had `os.execute`. Now the
        swarm has a ceiling (off by default), the root takes it, and a child
        inherits its parent's set. A spawn request carrying `sealed = true`
        narrows further, which is the supervisor that needs `os.time` itself
        but hands its workers an instance without it. There is no way to
        widen -- section 9.3 applied to flags.

      - |
        `DV_FLAG_UNSAFE_DEBUG` in `dv_config.flags`: open the whole `debug`
        library in this instance rather than the narrowed one. For profile A
        hosts, whose programs are their own. See **Upgrading**.

    changed:
      - |
        **An instance no longer has `io`, `os` or `package`, or `dofile` and
        `loadfile`.** Breaking for a program that used them; see **Upgrading**
        for the one-flag escape and what it costs.

        Taken now rather than deferred because the arithmetic only gets worse:
        `dv_new` has shipped exactly once, in 5.5.1_build3, which is flagged
        prerelease, is not `latest`, and is not on the release mirror -- so the
        set of hosts affected is as small as it will ever be, and grows from
        the moment a release carrying `dv_new` becomes `latest`. Deciding it
        here also means the `DV_FLAG_SEALED` of earlier drafts never ships and
        is not deprecated one release after being introduced.

    security:
      - |
        **An instance had every standard library, which section 18.2 did not
        say and this release did not intend.**

        `os.execute`, `os.remove`, `io.popen`, `io.open`, `package.loadlib`,
        `require`, `dofile` and `loadfile` were all reachable by a program
        loaded into an instance; `io.open('/etc/passwd')` returned a file
        handle. `dv_new` called `luaL_openlibs`, and no section of
        `doc/Messaging.md` ever decided the standard library surface -- it
        was inherited and never looked at.

        This is not a smaller version of the forgery problem below. It is a
        larger one, and it means 18.2's profile B was not reachable in
        5.5.1_build3 for a reason nobody had written down. The fix is the
        sealed default in **Changed**, not a flag you have to know about.

        Recorded as S1 in `doc/audit/M0-M7.md` under "Found since the sweep".

      - |
        **An endpoint reference can no longer be forged through the
        registry.**

        A reference is a table wearing a private metatable, and identity was
        metatable equality. `__metatable = false` hid it from `getmetatable`
        but not from `debug.getmetatable`, and the metatable itself sat in
        the registry under its own `__name`, which `debug.getregistry`
        returns. So a program that had been given nothing could prime the
        metatable into existence with any table at all, read it back out of
        the registry, wrap guessed peer bytes in a table wearing it, and get
        a live endpoint handle to any peer the host had pre-authorised. Every
        message it pushed arrived.

        Section 7.3's "a reference cannot be forged" was false, and 9.3's
        attenuation -- which treats a reference as a capability rather than a
        guessable name -- rested on it. Audit finding 6, reproduced end to
        end before it was fixed.

        No registry-side scheme fixes this while `debug.getregistry` is open,
        including keeping a weak-keyed set of the references the runtime
        actually made: a program that can read the registry finds that table
        too and adds itself to it. So the library narrows. See **Upgrading**.

      - |
        **A program can no longer switch off its own instruction budget.**

        `debug.sethook()` takes the single hook slot a `lua_State` has, and
        the budget of section 9.4 is a count hook in it. One line, no setup,
        no capability required: an instance given 200,000 instructions ran
        three million to completion, `dv_exceeded` reported false and
        `dv_usage` reported nought used.

        Not found by the M0-M7 audit. It is the same shape as two defects
        that audit did find on the host side -- a budget stored, reported by
        an accessor, and enforced by nothing -- reached from the guest side.

    fixed:
      - |
        Destroying an endpoint queue no longer makes its token permanently
        unusable.

        Nothing removed an entry from the token-to-handle map, and `bind`
        short-circuits on it, so binding the same reference again returned
        the destroyed handle and reported success. Pushing through it raised
        "handle 4 has been destroyed", and the host's `dv_endpoint_queue`
        went on naming the dead handle as the buffer to drain. Reachable by
        accident rather than by trying: `endpoint.bind` and `queue.destroy`
        are both in the guest table. Audit finding 11.

      - |
        Four checks that reported success without checking anything, which is
        worse than an absent check because an absent check is visibly absent.

        `dsnap_check`'s "every header refusal code has its own sentence"
        walked to the code that was last when it was written, so the two
        added since -- the two most likely to be reached by a hostile
        snapshot -- were never inspected, and it compared each sentence only
        against the fallback, so two codes could share one. `make
        verify_wasm` named four files no target produces and swallowed its
        own exit status through `| head`, so its first step could not fail
        and the target only ever failed for the wrong reason.
        `patch_series.sh check` exited 0 having examined nothing when the
        fork point was unreachable, which a shallow clone does.
        `test.yml`'s `include_skipped` named six tests when three are
        skipped, three of them recovered a release ago.

        Audit findings 18, 29, 30 and 31. Each is now confirmed to fail
        against the mutation it was supposed to catch.

      - |
        Two assertions that could not fail, and a row of section 6.4 that
        nothing checked from the host side.

        `test_msgpack.lua`'s malformed-input loops counted
        `pcall(...) == nil`, which cannot happen, so both were tautologies:
        the decoder could have returned a partially built value for every
        truncated input and the file would still have printed "0 failed".
        They now assert the property -- each single byte decodes exactly when
        it is a whole encoding, and every proper prefix of a real encoding is
        refused. And `disabled` was the one row of 6.4 with no host-side
        assertion: deleting the enabled check in `diluvium_queue_push_bytes`
        made a host push into a queue the program had disabled succeed
        silently, and nothing turned red. Audit findings 9 and 10.

      - |
        The parent-visible half of build3's sticky-error fix now has a test.

        The fix was in and asserted at the ABI level; what no test reproduced
        was what a *supervisor* is told. A supervisor that spawns a worker
        and asks for it to be hibernated in the same batch -- "start it
        asleep" -- had the hibernate correctly denied, and the refusal was
        left on the child, so when the child finished its work it was
        reported as `faulted` and a restart policy restarted it. Audit
        findings 15 and 19.

    known_issues:
      - |
        **Hibernation is switched off by default, and this release still
        recommends leaving it off.** Unchanged from 5.5.1_build3.

        `dvs_hibernate` refuses unless a host calls `dvs_allow_hibernation`
        first. The reason is a defect the layer above cannot work around: the
        thread record does not carry `u2.funcidx`, so an error raised in a
        *restored* program unwinds from the stack base instead of the frame
        that raised it, closing every to-be-closed slot in the thread and
        writing the error object over the driver's own function slot. That is
        memory corruption, not a wrong answer, and the ordinary
        wake-then-error path reaches it.

        **Note the switch covers the swarm layer and not the ABI underneath
        it.** `dv_restore` is a public call with no equivalent gate, so a
        host driving instances directly can reach the same path. Treat
        `dv_snapshot` and `dv_restore` as unsupported in this release unless
        you have read section 18.2 of `doc/Messaging.md` and decided
        otherwise.

        A deployment that keeps agent state at the application level and
        spawns a fresh instance per unit of work never enters that path, and
        pays little for it: `dv_new` plus `dv_load` of a small chunk is
        comparable to `dv_new` plus `dv_restore` of a value graph. Sizing for
        that: 42 KB per resident instance (`make footprint`).

        Four smaller snapshot defects sit behind the same switch: a woken
        instance's instruction budget is not re-armed, the swarm layer passes
        no host-identity stamp so its own snapshots are not authenticated,
        endpoints do not survive a snapshot, and the snapshot fuzzer's
        field-validation coverage is currently hollow -- a digest added later
        refuses every mutant before the field checks it was built to
        exercise, so "0 crashes" there is true but proves less than it
        appears to.

        These six are now the whole of what is open against the M0-M7 audit,
        and section 18.3 states the decision they amount to: whether this
        project supports hibernation at scale, or says it does not and
        strikes them.

      - |
        **A sealed program has no way to ask for the time.**

        Sealing closes the second boundary; it does not populate the first. An
        instance is supposed to reach outside itself by yielding a request its
        host answers, and `queue.wait` is the only thing that implements that
        -- there is no general hostcall yet. So a program that genuinely needs
        a clock or a file has `DV_FLAG_UNSAFE_STDLIB` and nothing better, which
        is exactly why that flag is scaffolding rather than a configuration.

        `doc/Determinism.md` carries the design, and it needs no ABI: a
        hostcall is a message on a queue the host drains and an answer on a
        queue it pushes to, which is measured working against this tree today
        with no new machinery. The one thing with a deadline is reserving a
        correlation token in the request encoding before the first hostcall
        ships, since a guest may have several outstanding at once.

      - |
        `DV_FLAG_UNSAFE_DEBUG` is a real hole, deliberately.

        A host that sets it gets the whole `debug` library back and, with it,
        the endpoint forgery route and the budget escape this release closed.
        That is profile A's configuration and it is supported -- but the flag
        is not a convenience toggle, and an instance carrying it should be
        treated as running trusted code. `dv_check` asserts that a program in
        such an instance can still switch its own budget off, so the cost is
        recorded in a test rather than only here.

      - |
        Section 10.7's precondition that a snapshot capture involve a single
        thread is documented but not enforced: nested coroutines are captured
        rather than refused. Audit finding 14, and part of the hibernation
        block above.

  - version: "5.5.1_build3"
    tag: v5.5.1_build3
    date: 2026-08-10
    status: released
    stable: false
    mirror: false
    lua_base: "5.5.1"
    bytecode_format: 0x46
    summary: |
      **A pre-release, deliberately.** Not because it is unfinished or
      untested -- the suite, the sanitizers and the fuzzers are green, and the
      feature set below is complete -- but because the configuration it is
      *supported in* is narrower than the feature set it ships. Hibernation is
      switched off and should stay off; the capability layer is a structuring
      device rather than a security boundary, so every program loaded must be
      one you wrote or templated. Both are spelled out under **Known issues**,
      which is the part of these notes to read before deploying anything.

      `latest` stays on 5.5.1_build2 for that reason, and the release mirror
      does not carry this one. A deployment that wants it should name the tag.

      Two things in it, and the second is the larger one.

      Compiled chunks are checked at load time instead of being trusted,
      which closes finding 8.

      And Diluvium becomes a messaging runtime: a program can hold bounded
      queues, park on them, and be driven by a host that moves bytes between
      instances -- with a C ABI for embedding one instance, an optional
      library for supervising many, and snapshot and restore underneath. The
      design and its milestones are `doc/Messaging.md`; what is finished, what
      is deliberately switched off, and what a deployment is accepting are in
      **Known issues** below and in section 18 of that document.

      Read the profiles in 18.2 before deploying this. The short version:
      **hibernation is off by default and should stay off** in this release,
      and the capability layer is a structuring device rather than a security
      boundary while the `debug` library is available to guests. Everything
      else in the messaging feature set is finished and tested.

    upgrading: |
      Nothing in the messaging work changes an existing program: the new
      libraries are additions, and a program that does not call them behaves
      as before. The two new libraries are opened for every state, so a
      program with its own global named `queue`, `endpoint` or `msgpack`
      will find it shadowed.

      `LUAC_FORMAT` is 0x46. Chunks compiled by an earlier Diluvium will
      be refused at the header and must be recompiled from source. The
      layout did not change; the secure-function scramble did, and a
      chunk scrambled under the old one would still parse and decode to
      garbage, so the format byte is what turns a silent misread into a
      refusal.

    added:
      - |
        `msgpack`: a codec that round-trips a Lua value graph.

        Encode, decode, `as_array` and `as_map` for the shapes msgpack can
        represent but Lua cannot distinguish (an empty table is a map, not an
        array -- one of several places this bites), and `msgpack.ext` for
        application ext codes 0x10 to 0x7F. Codes below 0x10 are reserved by
        the registry in section 5.5 and are refused in both directions, so a
        program cannot write bytes only the runtime is supposed to mean
        something by.

        Integers stay integers and floats stay floats across a round trip,
        which is a property the queue layer depends on rather than a nicety.

      - |
        `queue`: bounded message queues, and a program that can park on one.

        `queue.declare`, `lookup`, `push`, `pop`, `len`, `capacity`,
        `destroy`, `disable`, and `queue.wait` over a set of them with an
        optional timeout. Queues are bounded on purpose: a full queue blocks
        the sender or fails the push, so backpressure is visible instead of
        being absorbed by memory growth.

        A program that calls `queue.wait` with nothing to read parks, and its
        host decides when it runs again. That is the whole shape of the
        runtime: no threads, no scheduler, no callbacks -- a program is a
        coroutine that stops when it has nothing to do.

      - |
        `endpoint`: a queue handle for something that is not in this state.

        A program receives an *endpoint reference* in a message and calls
        `endpoint.bind`, and what it gets back is an ordinary queue handle --
        `push`, `len`, `wait` all work unchanged. A sender cannot tell an
        endpoint from a local queue and does not need to.

        The runtime never learns what a reference means. The host resolves it,
        either through a callback or by pre-authorising bytes with
        `dv_endpoint_allow`, and then moves bytes between instances itself. A
        three-instance relay is five lines of Lua and no C on either side.

      - |
        `diluvium --task`: run a program that waits.

        The CLI grew a second entry mode, hosted on a coroutine, so a program
        that parks on `queue.wait` can be run from the command line and driven
        to completion. Ctrl-C interrupts a runaway loop in both modes.

      - |
        The instance ABI (`dv.h`, `libdiluvium`): one sandboxed instance,
        embeddable in about a dozen calls.

        `dv_new`, `dv_load`, `dv_run`, `dv_resume`, `dv_free`; queue push and
        pop by name; endpoint resolution; `dv_set_budget`, `dv_usage`,
        `dv_exceeded`; `dv_snapshot` and `dv_restore`. An instance never runs
        unbounded: a budget caps instructions and memory, and exceeding one
        stops the program with an error rather than the process with an abort.

        The header is self-contained -- no Lua header, no internal type -- and
        the contract tests are written against it alone, which is how that
        claim is kept true. Bindings for Rust (including a wasmtime host),
        Python and JavaScript ship with it, and the JavaScript one carries a
        portable WASI preview-1 host so a `.wasm` build runs in Node with no
        native dependency.

      - |
        Snapshot and restore: a running program's state as bytes.

        A parked instance can be written out and read back -- the value graph
        including cycles and shared references, closures with their upvalues,
        suspended coroutines with their frames, and content-addressed
        prototypes so a snapshot names code rather than carrying it. A
        permanents table keeps host objects out of the bytes.

        Restore treats its input as hostile: a header with a runtime
        fingerprint, structural validation, and a structure-aware fuzzer that
        mutates real snapshots and asserts a refusal rather than a crash. See
        **Known issues** for what is not finished here.

      - |
        `libdiluvium-swarm` (`dvs.h`): supervising many instances, as a
        separate library.

        An instance table, one parent link each, a capability set per
        instance, and a step function that drains each program's
        `system/lifecycle` queue and acts on what it finds -- spawn, kill,
        hibernate, query. Capabilities attenuate: a supervisor can never grant
        a child more than it holds, and `dvs_kill` takes the subtree because
        reparenting is harder to remove once something depends on it. Spawns
        are rate-limited per step, because a self-rewriting system produces a
        fork bomb eventually as a bug rather than an attack.

        There is no supervisor type, and that is the design rather than an
        omission: a supervisor is a program holding one capability. Restart
        strategies, backoff, routing and topology are ordinary Diluvium
        programs, which for a system whose programs are generated at runtime
        is the entire point.

        An app embedding a single sandbox links none of this.

      - |
        `make footprint`: what a resident instance costs, measured.

        42 KB for an instance parked on a queue -- 41 MB for a thousand, 410
        MB for ten thousand, roughly 25,000 on a 1 GB machine. Measured
        through `dv_usage` rather than RSS so the number is the same on every
        machine. It prints and asserts nothing: a threshold here would fail
        when someone adds a library rather than when something is wrong.

        This is the number to plan capacity with, and it had been guessed at
        from a snapshot's size (about 1.8 KB), which is the wrong figure once
        instances stay resident.

    security:
      - |
        The bytecode loader verifies an instruction's operands against the
        prototype that owns them.

        Lua has shipped no bytecode verifier since 5.2, and Diluvium
        inherited that. `script/fuzz_exec.py` measured what it costs:
        roughly 7% of single-byte-mutated chunks crashed the release
        interpreter when run -- segmentation faults and
        `munmap_chunk(): invalid pointer`, not errors -- and about a fifth
        of those were out-of-bounds heap *writes*. The loader reported
        clean only because `script/fuzz_undump.lua` never executed what it
        accepted.

        `luai_verifycode` is now implemented rather than empty. Every
        instruction's register, constant, upvalue and prototype index is
        checked against the prototype's own limits, and every jump target
        against its code length, before the chunk is handed back. The check
        also reaches past the instruction stream: line info must cover the
        code or be absent (a short one reads out of bounds on the first
        error), absolute line entries must be ordered and in range, and a
        few operands with undefined behaviour at the extremes (a table hash
        size that would shift a word by its full width) are bounded.

        Two fuzzers now gate it. `script/fuzz_exec.py` flips random bytes
        and measures the accident rate; `script/fuzz_struct.py` is new and
        measures the attack rate -- it finds the code array and sets each
        operand out of range for the prototype that owns it, which is
        exactly what the verifier checks. On one corpus that turns 111
        crashes into none.

        One opcode needed more than the verifier. `OP_SETLIST` (and the
        vararg-table path) read a register as a table without testing it
        was one -- a dataflow property a load-time check cannot settle --
        so the VM now tests it and raises a catchable error rather than
        dereferencing a wild pointer, the way its sibling opcodes already
        do. With that, both fuzzers pass at `--allowed 0`: no single-byte
        or operand mutation crashes the release interpreter on the corpus.

        The claim this supports is that **malformed bytecode is refused or
        errors rather than crashing**. It is not that bytecode is safe: Lua
        5.1 shipped a fuller checker than this one and still had escapes.
        `load(bytes, name, "t")` remains the complete mitigation, and
        inspecting a chunk with `diluvium_compiler -r` remains safer than
        running it.

      - |
        A secure (`~`) function's strings no longer fall out of a single
        XOR pass over the dump.

        The scramble was one repeated byte, and had been since the feature
        was written; the two rounds of fixes before this one were about
        *where* it was applied, never what it was. So `strings` on a dump
        found nothing, exactly as advertised -- and `tr` or two lines of
        `xxd` recovered every hidden string at once, which is not
        meaningfully better than the text editor the README says a secure
        function defends against. The gap was between the claim and the
        constant, not in the coverage.

        It is now a generated keystream, seeded from the block length so
        blocks do not all share a prefix. `test_secure_dump.lua` sweeps all
        256 single-byte keys rather than checking the one in `ldump.c`, so
        the test states a property of the encoding instead of a fact about
        a number, and the CI obfuscation audit does the same sweep over the
        real `luac` output. Verified to fail on the previous scheme.

        Two properties are now asserted because other work depends on them.
        The scramble is deterministic -- no nonce, nothing carried between
        blocks -- because content-addressing prototypes by the hash of
        their stripped dump needs identical source to give identical bytes,
        and a nonce would have broken that silently, round-tripping
        perfectly while the cache stopped working. And it is self-inverse,
        which is what lets the loader hold the same function under another
        name.

        This is still obfuscation and still not encryption. What changed is
        that recovering the strings now takes reading these sources and
        implementing the keystream -- trivial for anyone who wants to, and
        no longer one shell command for anyone who does not.

      - |
        An endpoint reference could be forged by a guest, two ways. One is
        closed; the other is why the capability layer is not yet a security
        boundary.

        Section 7.3 claims a reference "cannot be forged" because there is no
        constructor anywhere. There was one: `msgpack.decode` is callable by
        the program, and it ran the host's resolver on whatever bytes it was
        handed -- so a program could write `msgpack.decode('\xd4\x02' .. name)`
        and get a genuine reference to any peer the host had authorised.
        Proven end to end against a host that had authorised one peer and
        delivered nothing, where the guest reached that peer's queue. The
        reference was a guessable name, not a capability.

        Bytes that arrive from the host now resolve; bytes a program decodes
        itself surface as an inert opaque value. And they cannot be pushed
        back out to be re-decoded by the trusted path, because reserved ext
        codes are now refused at the point they would be written.

        **Not closed:** `debug.getmetatable` reaches the reference metatable
        and `debug.getregistry` reaches everything else, so a program holding
        one real reference can still mint one to any peer name it can guess.
        No scheme that keeps a reference's identity inside the runtime fixes
        that while the `debug` library is open to guests, which is why
        narrowing that library is the first item of the next profile rather
        than a patch here.

      - |
        A reserved ext code could be written from a program.

        `msgpack.ext` refuses codes below 0x10, but the wrapper it returns is
        an ordinary table: `w = msgpack.ext(0x10, s)` and then `w[3] = 0x02`
        produced exactly what the constructor had just refused. The check now
        runs where the bytes are written, because a constructor cannot vouch
        for a value that stays mutable.

        Filed as tidiness and turned out to be the security fix: it is what
        stops a decoded endpoint reference from being laundered back through a
        queue into the host's trusted delivery path.

    fixed:
      - |
        The swarm layer's own audit found fourteen defects in it, and the four
        that a supervisor would hit first are fixed.

        A clean exit was reported to the parent as `"faulted"`, because the
        instance's last error is sticky and nothing cleared it -- so a
        supervisor restarted healthy children. Certain to happen, not a corner
        case. A kill or hibernate request narrowed a 64-bit id to 32 bits,
        which destroyed a *different live instance* instead of refusing the
        request. A spawn's code was truncated at the first zero byte, and the
        child ran a prefix while the parent was told the spawn succeeded --
        harmless for source, silent corruption for bytecode. And a budget
        written the way section 9.1 documents it, nested under `budget = {...}`,
        was ignored: the child ran unbudgeted, which let a program escape its
        own budget through a child and hang the host's step loop.

        Also: a fault's detail was read from an instance the same function had
        already freed; a capability wildcard could *widen* a grant instead of
        narrowing it; querying a hibernated instance dereferenced a null; and
        subtree kill recursed once per link where its own comment said it did
        not (measured before fixing: not reachable on any machine that could
        hold the instances, and fixed anyway so the code matches the comment).

      - |
        A reference could not be passed in a message, which is the shape a
        router has.

        A reference is an opaque object, so it went onto the wire as a plain
        one-element array: a program could use an endpoint it was handed but
        could not hand one on. The codec's resolver seam had an encode hook
        for exactly this and nothing implemented it -- and could not have, since
        the hook was only offered values the codec could not encode, and this
        one it could. Asserted now on the wire and end to end through two
        instances.

      - |
        A five-byte message could make the decoder ask for 131 MB.

        A map header claiming a huge length pre-sized a table before any
        bytes were read. Table pre-sizing is now clamped by what is actually
        left in the buffer. Found by feeding the token cursor 400,000 hostile
        inputs under AddressSanitizer, which also found an integer overflow
        that only bites where `size_t` is 32 bits -- which is wasm32, one of
        the platforms this ships for.

      - |
        `dv_resume` invented a timeout that had never elapsed.

        A host naming a queue that was live, enabled and empty was told
        `"timeout"` -- to a program that had passed no timeout, which would
        then take that branch and index the nil it was handed. It now stays
        parked and reports idle, which the host may retry. The CLI host had
        always done this correctly, so two in-tree hosts of one protocol had
        disagreed.

      - |
        Three CI jobs had been red on every run, and the tests that only ran
        there were the reason to care.

        The wasm job needed a wasmtime feature that had been renamed, the Rust
        binding pinned a wasmtime four major versions back, and a
        library-loading test needed a container it did not have. Asking the
        same question of everything else found more: no contract test had ever
        run under a sanitizer (which found undefined behaviour on its first
        run), the token cursor had never seen malformed input, four of six
        skipped tests were skipped for reasons that were factually wrong, and
        `libdiluvium-swarm` -- named as a release artifact -- was never built
        by anything. All six now run, and the swarm library's layer boundary is
        checked at the linker rather than by inspection.

    known_issues:
      - |
        **Hibernation is switched off by default, and this release recommends
        leaving it off.**

        `dvs_hibernate` refuses unless a host calls `dvs_allow_hibernation`
        first. The reason is a defect the layer above cannot work around: the
        thread record does not carry `u2.funcidx`, so an error raised in a
        *restored* program unwinds from the stack base instead of the frame
        that raised it, closing every to-be-closed slot in the thread and
        writing the error object over the driver's own function slot. That is
        memory corruption, not a wrong answer, and the ordinary
        wake-then-error path reaches it.

        The switch exists to make the defect unreachable rather than
        documented. A deployment that keeps agent state at the application
        level and spawns a fresh instance per unit of work never enters that
        path, and pays little for it: `dv_new` plus `dv_load` of a small chunk
        is comparable to `dv_new` plus `dv_restore` of a value graph. Sizing
        for that: 42 KB per resident instance (`make footprint`).

        Four smaller snapshot defects sit behind the same switch: a woken
        instance's instruction budget is not re-armed, the swarm layer passes
        no host-identity stamp so its own snapshots are not authenticated,
        endpoints do not survive a snapshot, and the snapshot fuzzer's
        field-validation coverage is currently hollow -- a digest added later
        refuses every mutant before the field checks it was built to exercise,
        so "0 crashes" there is true but proves less than it appears to.

      - |
        **The capability layer is not a security boundary in this release.**

        It is a structuring device, and a good one: attenuation, subtree kill
        and per-instance budgets all work and are tested. But a program that
        holds one endpoint reference can forge another through the `debug`
        library, so a deployment must treat every program it loads as trusted
        -- written or templated by the operator, not generated by an untrusted
        party and not accepting arbitrary code from a user.

        Section 18.2 of `doc/Messaging.md` calls this profile A and states what
        closing the gap requires.

      - |
        Two smaller sharp edges worth knowing.

        Rebinding an endpoint token whose queue was destroyed returns the
        destroyed handle and poisons the token permanently -- a program should
        not `destroy` a bound endpoint queue and re-bind it. And section 10.7's
        precondition that a snapshot capture involve a single thread is
        documented but not enforced: nested coroutines are captured rather
        than refused.

  - version: "5.5.1_build2"
    tag: v5.5.1_build2
    date: 2026-08-08
    status: released
    stable: true
    latest: true
    mirror: true
    lua_base: "5.5.1"
    bytecode_format: 0x45
    summary: |
      A security release for the 5.5 line. Secure (`~`) functions did not
      hide string constants that ordinary code in the same chunk also
      used, so a shared literal was stored in the dump in the clear.

      Only the 5.5 line is affected. Lua 5.5 introduced the saved-string
      table this depends on, so 5.4.7 and earlier never had it.

    security:
      - |
        Secure functions no longer leak strings that ordinary code shares.

        Lua 5.5 writes each distinct string in a chunk once and refers back
        to it by index. Scrambling decided by a function's position in the
        prototype tree stops being sound under that, because a string
        shared between a secure function and ordinary code has exactly one
        stored copy -- at whichever site was written first. A function
        dumps its own constants before recursing into its children, so a
        literal shared with the enclosing function was always stored
        unscrambled, whatever the source order:

            local tag = "license-key";
            ~function check() return "license-key" end

        `strings` found it. Among siblings it depended on which was dumped
        first, so the same source leaked or did not depending on where else
        a literal happened to appear. It round-tripped correctly either
        way, which is why nothing failed: the function was marked secure
        and the bytes simply were not there.

        The dump now walks the whole prototype tree before writing
        anything and marks every string a secure function will contribute;
        a marked string is scrambled wherever it is written. A consequence
        worth knowing: a literal shared with a secure function is hidden in
        the ordinary function's copy too. There is only the one copy, and
        the secure function decides.
      - |
        `LUAC_FORMAT` moves from 0x44 to 0x45.

        Because a string's secrecy is no longer implied by its position, a
        written string's size field now carries a scramble flag in its low
        bit. That is a format change, so the byte is bumped and stale
        chunks are refused rather than misread.

    fixed:
      - |
        The bytecode loader leaked memory on every malformed chunk it
        refused.

        `loadString` held a secure function's scratch buffer in a local
        across `loadVector`, which raises on a truncated chunk, so the
        buffer was never freed. A program refusing untrusted bytecode in a
        loop leaked without bound. Short strings now unscramble in a local
        buffer and long ones in the string's own storage, so there is no
        allocation to lose. Present since the 5.5.1 rebase.
      - "A corrupt string size is rejected by name instead of being acted on."
      - |
        The analysis report decoded table constructor sizes with the wrong
        instruction operands.

        `OP_NEWTABLE` is an `ivABC` instruction, where `vB` is six bits and
        `vC` ten, against eight each for `B` and `C`. `analyze.c` still
        read it as Lua 5.4 did, so it took two bits of `vC` along with
        `vB` and started two bits into `vC` -- wrong array and hash sizes
        in every report, and a shift wide enough to be undefined
        behaviour. The guard that would have caught it is a debug-build
        assertion, so release builds read the wrong bits in silence.
        Found by UBSan on a valid chunk.

    added:
      - |
        `test/test_secure_dump.lua`, covering the dump-level security
        property directly: shared literals, both sibling orders, both sides
        of the short-string boundary, debug names, stripped and unstripped,
        and back-references -- and that all of it still round-trips once a
        string is hidden away from the function that hid it.
      - |
        CI's obfuscation audit now shares a literal between a secure
        function and ordinary code, and checks the unstripped dump too.
        Its previous probe used markers only inside the secure function and
        so could not have caught this.
      - |
        `CHANGELOG.yaml` is now the source of truth for release notes,
        rendered by `script/changelog.py`.

        Release bodies previously carried no changelog at all -- the whole
        user-visible change list for 5.5.1_build1 was GitHub's
        auto-generated line naming one squashed pull request. That
        auto-generation is off, and the release page is now built from this
        file plus the download guide, which is derived from what a build
        produced rather than from what changed.

        `CHANGELOG.md` and `changelog.json` are generated and committed;
        CI fails when they drift, and the release mirror reads the JSON.
        The `mirror` and `latest` fields replace the mirror's
        hand-maintained tag pins.
      - |
        CI checks that the tree agrees with the newest changelog entry.

        The version is written in three places -- `VERSION`,
        `.technoproj` and `src/lua.h` -- and `LUAC_FORMAT` in a fourth.
        `script/changelog.py consistency` fails when any of them drifts
        from the entry that claims to describe them.
      - |
        A release cannot be published for a tag the changelog does not
        describe as released, so a release page can no longer say
        "unreleased".
      - |
        Performance is tracked per release, in `BUILDSTATS.json`.

        `script/bench.lua` measures thirteen cases, Diluvium's own
        constructs among them -- f-strings with and without a format spec,
        `switch`, safe navigation, `defer`, and a dump/load round trip
        through a secure function -- so the cost of the features this fork
        exists for is measured rather than assumed.

        The comparable figure is the VM instruction count, not elapsed
        time. It is deterministic: the same code on the same build gives
        the same number on any machine, so a movement in it is real work
        added or removed, where a wall-clock movement on a shared runner
        usually is not. Counting uses a count hook rather than a patched
        VM, so the harness is ordinary Lua and runs anywhere Diluvium
        runs. Times are recorded beside the counts and are advisory.

        `build_stats.sh compare` reports instruction deltas alongside size
        deltas and can fail over a percentage, so a performance regression
        can be refused rather than merely logged. Counts are comparable
        within a build configuration: the debug build changes codegen
        parameters and so emits different bytecode.

    known_issues:
      - |
        Compiled chunks from an untrusted source are not safe to run.

        Instructions carry register, constant and upvalue indices that
        nothing checks against the prototype that owns them, so a corrupt
        or hostile chunk can reach memory it should not. Measured with
        `script/fuzz_exec.py`: about 7% of single-byte-mutated chunks
        crash the interpreter when run, and roughly a fifth of those are
        out-of-bounds heap writes rather than mere crashes.

        This is Lua's position as much as Diluvium's -- Lua has shipped no
        bytecode verifier since 5.2 -- but it deserves stating outright
        here, because secure functions and the analysis report exist so
        that a chunk somebody else compiled can be handed to you. The
        complete mitigation is Lua's own `mode` argument:
        `load(bytes, name, "t")` refuses binary chunks.

        Inspecting is safer than running: `diluvium_compiler -r` describes
        a chunk without executing it, and the loader alone survived 30,000
        mutated chunks without a crash. Safer is not safe. A load-time
        verifier is the fix and is the largest open item on the runtime.
        Source `.lua` files are unaffected.

    upgrading: |
      Bytecode compiled by 5.5.1_build1 will not load in 5.5.1_build2, and
      the reverse. Recompile any `.luac` produced by build1. Source is
      unaffected, and nothing about the language changed.

      This release also states the fork's compatibility promise outright
      (see `Compatibility` in the README), so that "stable" means
      something specific rather than being a tone of voice. In short:
      source compatibility with stock Lua is absolute and will not change;
      the 5.5 syntax is settled and keeps its meaning; the bytecode format
      may move between builds, and a stale chunk is refused rather than
      misread. The next format change is expected when decimal literals
      land.

  - version: "5.5.1_build1"
    tag: v5.5.1_build1
    date: 2026-08-07
    status: released
    stable: true
    mirror: true
    lua_base: "5.5.1"
    bytecode_format: 0x44
    summary: |
      First release of the 5.5 line, and the one that brings the language
      work: `switch`, `defer`, `with`, safe navigation, compound
      assignment and f-string format specifications, plus a rewritten
      interactive interpreter that no longer depends on GNU readline.

      Named `5.5.1_build1` rather than a release candidate to stay out of
      upstream Lua's version space -- upstream will never ship that
      suffix, so a Diluvium build cannot be mistaken for one.

    added:
      - |
        `switch` statement. The subject is evaluated once, a case can list
        several values, and there is no fallthrough.

        It is a contextual keyword, so existing code using `switch` as a
        name keeps working. The one consequence is that a subject cannot
        start with `(`, a string or a table constructor, because
        `switch (x)`, `switch "s"` and `switch {}` are all calls in stock
        Lua and have to keep meaning that.
      - |
        `defer` and `with`, for scope-bound cleanup.

        `defer stat` runs a statement however the block is left. `with
        NAME = expr do ... end` binds a to-be-closed local scoped to the
        block. Both desugar to Lua's to-be-closed variables, so ordering
        and unwinding are inherited rather than invented: they run in
        reverse declaration order on end of block, `break`, `goto`,
        `return`, an error, and `coroutine.close`.
      - |
        Safe navigation, `a?.b` and `a?[k]`.

        Once the value left of a `?` is nil the whole remaining chain is
        skipped -- nothing further is indexed or called -- and the result
        is nil. It tests nil, not falsiness, so `false?.x` still raises.
      - |
        Compound assignment: `+=`, `-=`, `*=`, `/=`, `//=`, `%=`, `^=`,
        `|=`, `&=`, `<<=`, `>>=`, `..=` and `??=`.

        The target's prefix is evaluated once, so `t[next_key()] += 1`
        calls `next_key` a single time. There is no `~=` form, since that
        already means "not equal".
      - |
        F-string format specifications, `$"{value::%.2f}"`.

        Everything after `::` is handed to `string.format`. It is `::` and
        not the `:` other languages use because `:` already introduces a
        method call, and `$"{obj:method()}"` has to keep meaning that.
      - |
        A built-in line editor: syntax highlighting as you type, tab
        completion through tables and metatable `__index`, and persistent
        history in `~/.diluvium_history`.

        `NO_COLOR`, `DILUVIUM_NO_COLOR` and `TERM=dumb` turn highlighting
        off. `diluvium -h` lists the options and `help()` explains what
        Diluvium adds to Lua.
      - |
        The REPL's intelligence is now shared with every front end.

        Telling unfinished input from broken input, echoing expressions and
        completing names live in `drepl.c` -- on-top code using only the
        public C API -- so the interpreter and the WASM host run one
        implementation. The WASM builds export `repl_eval`, `repl_complete`
        and `reset_lua`. Before this a browser front end could only tell
        "keep typing" from "that's wrong" by matching the text of Lua's
        error messages.
      - "`doc/repl-reference.html`, a working browser REPL and the reference for driving the WASM build."
      - |
        Build statistics. `script/build_stats.sh` records every artifact's
        size plus `text`/`data`/`bss` for the native ones, which is what
        says where growth came from rather than only that it happened.
        `BUILDSTATS.json` ships as a release asset, so every release is a
        permanent data point.
      - "`doc/Analyzer.md`, describing what the bytecode analyzer computes today and the four limits that shape it."

    changed:
      - |
        Rebased onto Lua 5.5.1, from 5.4.7.

        Diluvium's changes to the Lua sources are held to 14 files, checked
        against pristine upstream by `script/patch_series.sh` in CI, which
        is what makes a rebase of this size tractable.
      - |
        F-strings rewritten.

        Escape handling is now shared with plain strings, so `\x`, `\ddd`,
        `\u` and `\z` mean the same thing inside an f-string as outside --
        they were silently wrong before. Nesting works, interpolation
        resolves `tostring` through `_ENV` so a sandbox can control it, and
        a whole f-string compiles to a single N-ary `CONCAT` rather than a
        chain of pairwise ones.

    removed:
      - |
        GNU readline.

        It was GPLv3, which made the released binaries a combined work
        under GPLv3 rather than the Apache-2.0 the repository advertises,
        and statically linked it was larger than the whole runtime. The
        replacement is `dline.c`, written rather than vendored so the tree
        stays under one licence. The binary now links only libc and libm,
        and grew 13 KB for it.

    fixed:
      - "F-string nesting and escape sequences (handoff findings 6 and 7)."
      - "`$` no longer falls through to create `$`-prefixed identifiers."

    known_issues:
      - |
        Secure functions leak string constants that ordinary code in the
        same chunk also uses. Fixed in 5.5.1_build2; see that entry. A
        `~function` whose literals are unique to it is unaffected.

    upgrading: |
      Bytecode from the 5.4 line will not load: this is a different Lua
      release with a different bytecode format. Recompile. Source is
      backward compatible, as ever -- every new construct is a syntax
      error in stock Lua and none of them takes a reserved word.


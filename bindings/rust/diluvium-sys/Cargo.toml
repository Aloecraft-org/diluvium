[package]
name = "diluvium-sys"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Raw FFI declarations for the Diluvium instance ABI"
links = "diluvium"
build = "build.rs"

[features]
default = []
# The Lua C API (src/lua.rs), for a front end that has to reach `drepl.c`.
# Off by default: `dv.h` is sealed -- bytes in, bytes out, no Lua type across
# the boundary -- and a `lua_State` is a deliberate exception to that, so it
# should be asked for. The symbols are in the archive either way; this gates
# the declarations, not the code.
lua = []
# The numeric build feature (doc/Plan-2026-09.md 2). Off by default, matching
# the Makefile's NUMERIC. Unlike `lua` this gates *code*, not declarations:
# every function in `dv.h` is linked either way, and this decides what the
# numeric ones do. Ask `dv_features()` at run time rather than reading this.
numeric = []

[dependencies]

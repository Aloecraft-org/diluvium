changed:
  - "A pull request records its change as one new `changelog.d/<name>.yaml` (section keys and bullets) instead of editing `CHANGELOG.yaml`. `render md --newest`, which a dev build's notes now use, includes them; `fold` moves them into the newest entry in the release-prep commit, and `release-check --publish` refuses while any are left. Two open PRs no longer conflict in `changelog.json`."
